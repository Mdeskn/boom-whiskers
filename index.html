<html lang="en">

<meta name="description" content="Boom Whiskers: a two-phone cat card game. Dodge the Kaboom Cat.">

<title>Boom Whiskers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Bricolage+Grotesque:opsz,wght@12..96,400;600;800&display=swap">
<style>
/* Layout: a one-screen card table. Opponent across the top, piles in the middle, your hand and buttons docked at the bottom. */
:root {
  --felt: #1b1533;
  --felt-2: #2a2150;
  --rail: #3b3170;
  --deep: #0d0a1a;
  --ink: #1f1a30;
  --paper: #fff4dc;
  --muted: #b9b0dc;
  --tomato: #ff4b2b;
  --mustard: #ffc23c;
  --mint: #5fe0b4;
  --pink: #ff6fa5;
  --display: 'Bowlby One', 'Arial Black', Impact, sans-serif;
  --body: 'Bricolage Grotesque', ui-rounded, 'Segoe UI', system-ui, sans-serif;
  --cw: clamp(84px, 27vw, 124px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--felt);
  background-image:
    radial-gradient(circle at 50% 38%, var(--felt-2) 0, var(--felt) 72%),
    radial-gradient(var(--rail) 1px, transparent 1.5px);
  background-blend-mode: normal;
  color: var(--paper);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; }
#app {
  height: 100%;
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
}
.top { display: flex; align-items: center; gap: 10px; }
.brand { font-family: var(--display); font-size: 16px; letter-spacing: .02em; color: var(--mustard); }
.chip {
  margin-left: auto; font-size: 12px; font-weight: 600; letter-spacing: .03em;
  padding: 4px 10px; border-radius: 99px; background: var(--rail); color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%;
}
.chip.good { background: #1f4d43; color: var(--mint); }
.chip.warn { background: #4d3b14; color: var(--mustard); }
.chip.bad { background: #5a1d1d; color: #ffb4a6; }
.iconbtn {
  border: 2px solid var(--rail); background: transparent; border-radius: 99px;
  font-weight: 800; font-size: 13px; padding: 4px 10px; cursor: pointer; color: var(--paper);
}
#screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }

.iconbtn.exit { border-color: #6b2a2a; color: #ffb4a6; }
@media (max-width: 430px) { #app.ingame .brand { display: none; } #app.ingame .chip { margin-left: 0; margin-right: auto; } }
.req { text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--mustard); margin-left: 4px; }
input.missing { border-color: var(--tomato) !important; box-shadow: 0 0 0 3px var(--tomato); }
.clock { margin: 2px 0 0; font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.clock b { display: inline-block; min-width: 3.2ch; padding: 1px 7px; border-radius: 99px; background: var(--rail); color: var(--paper); font-variant-numeric: tabular-nums; }
.clock.urgent b { background: var(--tomato); color: #fff; animation: pulse .9s ease-in-out infinite; }
.sheet .clock { color: #6d6488; }
.sheet .clock b { background: #e9dfc6; color: var(--ink); }
.sheet .clock.urgent b { background: var(--tomato); color: #fff; }
@keyframes pulse { 50% { transform: scale(1.12); } }
/* Buttons */
.btn {
  font-family: var(--display); font-size: 16px; letter-spacing: .02em; line-height: 1.1;
  color: var(--ink); background: var(--mustard);
  border: 3px solid var(--ink); border-radius: 14px; padding: 12px 12px; min-height: 52px;
  box-shadow: 0 4px 0 var(--deep); cursor: pointer;
  transition: transform .06s, box-shadow .06s;
}
.btn:active:not([disabled]) { transform: translateY(3px); box-shadow: 0 1px 0 var(--deep); }
.btn.hot { background: var(--tomato); color: var(--paper); }
.btn.nope { background: var(--pink); }
.btn.nope small { font-family: var(--body); font-weight: 800; font-size: 12px; background: var(--ink); color: var(--paper); border-radius: 99px; padding: 1px 7px; vertical-align: 2px; }
.btn.ghost { background: transparent; color: var(--paper); border-color: var(--rail); box-shadow: none; }
.btn.ghost.ink { color: var(--ink); border-color: var(--ink); }
.btn.small { min-height: 40px; font-size: 14px; padding: 8px 14px; }
.btn.big { min-height: 58px; font-size: 19px; }
.btn[disabled] { opacity: .42; cursor: default; box-shadow: none; }
.link { background: none; border: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 10px; font-weight: 600; }
:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }

/* Lobby */
.lobby, .wait { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding-top: 4px; overflow-y: auto; }
.hero { position: relative; width: 240px; height: 170px; margin: 6px 0 -4px; }
.hero .card { position: absolute; width: 104px; top: 14px; left: 68px; filter: drop-shadow(0 8px 0 rgba(0,0,0,.35)); }
.hero .h1 { transform: translateX(-62px) rotate(-14deg); }
.hero .h3 { transform: translateX(62px) rotate(14deg); }
.hero .h2 { transform: translateY(-14px); z-index: 2; animation: bob 2.8s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-20px) rotate(-2deg); } }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(34px, 10vw, 48px); line-height: .95; margin: 0; color: var(--paper); text-wrap: balance; text-shadow: 0 4px 0 var(--deep); }
.lede { margin: 0; color: var(--muted); max-width: 34ch; text-wrap: balance; }
.form { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 10px; text-align: left; margin-top: 6px; }
.form label { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
input#name, input#code {
  width: 100%; font: inherit; font-size: 17px; font-weight: 600; color: var(--ink); background: var(--paper);
  border: 3px solid var(--ink); border-radius: 12px; padding: 12px 14px; min-height: 52px;
}
input#code { font-family: var(--display); letter-spacing: .25em; text-transform: uppercase; text-align: center; }
.or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; margin: 4px 0; }
.or::before, .or::after { content: ""; flex: 1; height: 2px; background: var(--rail); }
.joinrow { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
.joinrow .btn { padding-inline: 22px; }
.warn { background: #4d1f1a; color: #ffd2c9; border-radius: 12px; padding: 10px 14px; margin: 0; max-width: 360px; font-size: 14px; }
.fine { color: var(--muted); font-size: 13px; margin: 0; }
.eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 18px 0 0; }
.eyebrow.ink { color: #6d6488; margin-top: 10px; }
.bigcode { font-family: var(--display); font-size: clamp(54px, 18vw, 76px); letter-spacing: .12em; color: var(--mustard); text-shadow: 0 5px 0 var(--deep); line-height: 1; padding-left: .12em; }
.paws { display: flex; gap: 12px; margin: 10px 0; }
.paws i { width: 16px; height: 16px; border-radius: 50%; background: var(--mustard); animation: paw 1.2s ease-in-out infinite; }
.paws i:nth-child(2) { animation-delay: .2s; } .paws i:nth-child(3) { animation-delay: .4s; }
@keyframes paw { 0%, 100% { transform: translateY(0); opacity: .35; } 40% { transform: translateY(-8px); opacity: 1; } }

/* Table */
.card { display: block; width: 100%; height: auto; aspect-ratio: 200 / 280; }
.table { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.opp { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 16px; background: rgba(13,10,26,.35); border: 2px solid transparent; }
.opp.active, .mine.active { border-color: var(--mustard); }
.who { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; }
.nm { font-family: var(--display); font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 9em; }
.pill { font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; background: var(--rail); color: var(--muted); padding: 2px 8px; border-radius: 99px; }
.pill.turn { background: var(--mustard); color: var(--ink); }
.fan { flex: 1; display: flex; justify-content: center; padding-left: 22px; height: 64px; align-items: center; min-width: 0; overflow: hidden; }
.ob { width: 42px; margin-left: -24px; transform: rotate(var(--r)); transform-origin: 50% 120%; filter: drop-shadow(0 3px 0 rgba(0,0,0,.3)); }
.mid { display: grid; grid-template-columns: 76px 1fr 76px; gap: 10px; align-items: center; }
.pile { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.pile .pc { width: 76px; filter: drop-shadow(0 4px 0 rgba(0,0,0,.35)); }
.deckstack { position: relative; width: 76px; }
.deckstack .under { position: absolute; inset: 0; transform: translate(4px, 4px) rotate(3deg); z-index: -1; }
.slot { width: 76px; aspect-ratio: 200/280; border: 3px dashed var(--rail); border-radius: 10px; }
.cnt { position: absolute; top: -8px; right: -8px; min-width: 28px; height: 28px; padding: 0 6px; border-radius: 99px; display: grid; place-items: center; background: var(--paper); color: var(--ink); border: 3px solid var(--ink); font-weight: 800; font-size: 13px; font-variant-numeric: tabular-nums; }
.lbl { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.status { min-width: 0; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.st-title { margin: 0; font-family: var(--display); font-size: 17px; line-height: 1.15; text-wrap: balance; }
.st-title.me { color: var(--mustard); }
.st-sub { margin: 0; font-size: 13px; color: var(--muted); text-wrap: balance; }
.pend { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; animation: pop .25s ease-out; }
.played { position: relative; display: flex; justify-content: center; }
.played .mini { width: 44px; margin: 0 -6px; filter: drop-shadow(0 3px 0 rgba(0,0,0,.3)); }
.nopes { position: absolute; right: -14px; top: 10px; display: flex; }
.nopes .mini { width: 40px; margin-left: -28px; transform: rotate(16deg); }
.cd { width: 100%; max-width: 160px; height: 7px; border-radius: 9px; background: var(--rail); overflow: hidden; }
.cd i { display: block; height: 100%; width: 100%; background: var(--mustard); border-radius: 9px; }
@keyframes pop { from { transform: scale(.85); opacity: .3; } to { transform: none; opacity: 1; } }
.log { all: unset; cursor: pointer; display: block; min-height: 3.6em; padding: 6px 10px; border-radius: 12px; background: rgba(13,10,26,.35); }
.log ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; font-size: 13px; color: var(--muted); }
.log li:last-child { color: var(--paper); font-weight: 600; }
.mine { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; border-radius: 16px; border: 2px solid transparent; background: rgba(13,10,26,.35); }
.hand { display: flex; align-items: flex-end; overflow-x: auto; overflow-y: hidden; padding: 26px 12px 12px 10px; scrollbar-width: thin; }
.stack { position: relative; flex: 0 0 auto; width: var(--cw); padding: 0; border: 0; background: none; cursor: pointer; transition: transform .14s ease; }
.stack + .stack { margin-left: calc(var(--cw) * -0.34); }
.stack .card { position: relative; filter: drop-shadow(0 4px 0 rgba(0,0,0,.4)); }
.stack .shadow { position: absolute; inset: 0; transform: translate(5px, -5px) rotate(4deg); filter: brightness(.7); }
.stack.sel { transform: translateY(-18px); }
.stack.sel .card:not(.shadow) { filter: drop-shadow(0 0 0 var(--mustard)) drop-shadow(0 6px 0 var(--mustard)); }
.badge { position: absolute; top: -6px; left: -4px; background: var(--ink); color: var(--paper); border: 2px solid var(--paper); font-weight: 800; font-size: 12px; border-radius: 99px; padding: 0 7px; line-height: 20px; }
.pick { position: absolute; top: -10px; right: -6px; width: 28px; height: 28px; border-radius: 50%; background: var(--mustard); color: var(--ink); border: 3px solid var(--ink); display: grid; place-items: center; font-weight: 800; font-size: 14px; }
.empty { color: var(--muted); margin: 0 auto 30px; }
.bar { display: flex; flex-direction: column; gap: 8px; }
.info { margin: 0; font-size: 13px; min-height: 3.2em; color: var(--paper); }
.info.dim { color: var(--muted); }
.role { font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; background: var(--rail); color: var(--muted); padding: 1px 7px; border-radius: 99px; margin-right: 2px; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btns.one { grid-template-columns: 1fr; }
.waitline { grid-column: 1 / -1; margin: 0; min-height: 52px; display: grid; place-items: center; color: var(--muted); font-weight: 600; text-align: center; border: 2px dashed var(--rail); border-radius: 14px; padding: 6px 12px; }

/* Modal sheets */
#modal { position: fixed; inset: 0; z-index: 20; background: rgba(9, 7, 18, .74); display: flex; align-items: flex-end; justify-content: center; padding: 12px max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.sheet { width: 100%; max-width: 460px; max-height: 100%; overflow-y: auto; background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 8px 0 var(--deep); animation: rise .22s ease-out; }
@keyframes rise { from { transform: translateY(30px); opacity: 0; } }
.sheet h2 { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 0; line-height: 1.05; text-wrap: balance; }
.sheet .sub { margin: 0; color: #4b4366; }
.sheet .dim { color: #6d6488; }
.sheet .btn { box-shadow: 0 4px 0 #b7a98a; }
.sheet .chipbtn { border: 2px solid var(--ink); background: #fff; border-radius: 99px; padding: 8px 14px; font-weight: 800; cursor: pointer; color: var(--ink); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row .mini { width: 44px; }
.row.three { justify-content: center; gap: 10px; flex-wrap: nowrap; }
.row figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.row figcaption { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: #6d6488; }
.card.mid { width: clamp(72px, 24vw, 108px); }
.duo { display: flex; justify-content: center; gap: 0; }
.duo .card { width: 96px; filter: drop-shadow(0 4px 0 rgba(0,0,0,.25)); }
.duo .card:first-child { transform: rotate(-8deg); }
.duo .card:last-child { transform: rotate(8deg) translateX(-10px); }
.slab { font-weight: 600; }
#dpos { width: 100%; accent-color: var(--tomato); height: 32px; }
.quick { display: flex; gap: 8px; flex-wrap: wrap; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 10px; }
.pickcard { padding: 0; border: 0; background: none; cursor: pointer; border-radius: 12px; }
.pickcard:active { transform: scale(.96); }
.over { text-align: center; align-items: center; }
.boom { position: relative; width: 150px; margin: 4px auto 6px; }
.boom .bigcard { width: 120px; margin: 0 auto; transform: rotate(-6deg); }
.boom.lost { animation: shake .5s ease-in-out 2; }
.burst { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%) rotate(-10deg); font-family: var(--display); font-size: 42px; color: var(--mustard); -webkit-text-stroke: 3px var(--ink); paint-order: stroke; text-shadow: 0 4px 0 var(--ink); animation: pop .4s ease-out; }
.boom.won .burst { color: var(--mint); }
@keyframes shake { 20% { transform: translateX(-8px) rotate(-3deg); } 40% { transform: translateX(8px) rotate(3deg); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.rules { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.rules li { display: grid; grid-template-columns: 46px 1fr; gap: 10px; align-items: start; font-size: 14px; }
.rules .tiny { width: 46px; }
.rules .role { background: #e9dfc6; color: #4b4366; }
.fulllog { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.fulllog li:first-child { font-weight: 800; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 14px; padding: 10px 14px; font-weight: 600; max-width: min(92vw, 420px); text-align: center; box-shadow: 0 4px 0 var(--deep); }
@media (max-height: 640px) {
  :root { --cw: clamp(64px, 18vw, 88px); }
  .hero { display: none; }
  .fan { height: 50px; } .ob { width: 34px; }
  .mid { grid-template-columns: 62px 1fr 62px; } .pile .pc, .deckstack, .slot { width: 62px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div id="app">
  <header class="top">
    <span class="brand">Boom Whiskers</span>
    <span id="chip" class="chip">Connecting</span>
    <button class="iconbtn" data-act="rules" aria-label="How to play">Rules</button>
    <button class="iconbtn exit" id="exitbtn" data-act="exit" hidden>Leave</button>
  </header>
  <main id="screen"></main>
</div>
<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>// Phone-to-phone connection over PeerJS, shaped like the small "room" API the game uses:
// presence(obj) shares your state, peers() lists everyone, onPeers/onConnection notify changes.
(function () {
  window.BW_STANDALONE = true;
  window.BW_ROOM = function () {
    if (typeof window.Peer !== 'function') return null;
    const PREFIX = 'boomwhiskers-v1-';
    let mine = {}, peer = null, myRole = null, myCode = null, online = true, retryT = 0;
    const conns = new Map();
    const peerHandlers = [], connHandlers = [], issueHandlers = [];

    function peers() {
      const list = [{ peer: 'me', isMe: true, sameTab: true, presence: mine }];
      for (const r of conns.values()) if (r.presence && r.conn.open) list.push({ peer: r.conn.peer, isMe: false, sameTab: false, presence: r.presence });
      return list;
    }
    const emitPeers = () => { const ps = peers(); setTimeout(() => peerHandlers.forEach((h) => h({ peers: ps })), 0); };
    const setOnline = (v) => { if (v !== online) { online = v; connHandlers.forEach((h) => h(v)); } };
    const issue = (type) => issueHandlers.forEach((h) => h(type));
    function send(r) { if (r.conn.open) { try { r.conn.send({ t: 'p', p: mine }); } catch (e) { } } }

    function wire(conn) {
      const r = { conn, presence: null };
      conns.set(conn.peer, r);
      conn.on('open', () => { send(r); emitPeers(); });
      conn.on('data', (d) => {
        if (d && d.t === 'p' && d.p && typeof d.p === 'object' && !Array.isArray(d.p)) { r.presence = d.p; emitPeers(); }
      });
      conn.on('close', () => {
        if (conns.get(conn.peer) === r) conns.delete(conn.peer);
        emitPeers();
        if (myRole === 'guest') scheduleRetry(1500);
      });
      conn.on('error', () => { });
      conn.on('iceStateChanged', (s) => { if (s === 'failed') issue('ice-failed'); });
    }
    function connectHost() {
      if (!peer || peer.destroyed || myRole !== 'guest' || !peer.open) return;
      for (const [k, r] of conns) { if (r.conn.open) return; try { r.conn.close(); } catch (e) { } conns.delete(k); }
      wire(peer.connect(PREFIX + myCode.toLowerCase(), { reliable: true, serialization: 'json' }));
      scheduleRetry(6000); // if it never opens, try again
    }
    function scheduleRetry(ms) { clearTimeout(retryT); retryT = setTimeout(connectHost, ms); }
    function teardown() {
      clearTimeout(retryT);
      for (const r of conns.values()) { try { r.conn.close(); } catch (e) { } }
      conns.clear();
      if (peer) { try { peer.destroy(); } catch (e) { } }
      peer = null; myRole = null; myCode = null;
      setOnline(true);
      emitPeers();
    }
    function ensure() {
      const role = mine.role, code = mine.g;
      if (!role || !code) { if (peer) teardown(); return; }
      if (peer && role === myRole && code === myCode) return;

    S: 'End one turn without drawing a card.',

    const dis = busy ? 'disabled' : '';
    if (v.ph === 'pending' && v.pend) {
      const responder = 1 - v.pend.last;
      if (responder === me) {
        const nN = v.hand.split('').filter((c) => c === 'N').length;
        btns = `<button class="btn nope" data-act="nope" ${nN && !busy ? '' : 'disabled'}>Nope! <small>${nN}</small></button><button class="btn" data-act="pass" ${dis}>Let it happen</button>`;
      } else btns = `<p class="waitline">Waiting to see if ${oname} Nopes…</p>`;
    } else if (v.ph === 'play' && v.turn === me) {
      const kind = selKind();
      btns = `<button class="btn" data-act="play" ${kind && !busy ? '' : 'disabled'}>${playButtonLabel(kind)}</button><button class="btn hot" data-act="draw" ${dis}>Draw a card</button>`;
    } else if (v.ph === 'play') {
      btns = `<p class="waitline">${oname} is playing. You can still Nope their cards.</p>`;
    } else btns = `<p class="waitline">…</p>`;
    return info + `<div class="btns">${btns}</div>`;
  }

  function renderScreen() {
    const el = $('#screen');
    let key = screen;
    if (screen === 'join') key += ':' + full + ':' + partnerHere + ':' + (Date.now() - lookStart > 8000);
    if (screen === 'lobby') key += ':' + roomState;
    if (screen === 'table') {
      if (!V) return;
      const sc = $('#hand');
      const sx = sc ? sc.scrollLeft : 0;
      el.innerHTML = tableHTML(V);
      const nh = $('#hand');
      if (nh) nh.scrollLeft = sx;
      screenKey = 'table';
      return;
    }
    if (key === screenKey) return;
    screenKey = key;
    if (screen === 'lobby') el.innerHTML = lobbyHTML();
    else if (screen === 'hostwait') el.innerHTML = hostWaitHTML();
    else if (screen === 'join') el.innerHTML = joinHTML();
    else if (screen === 'closed') el.innerHTML = closedHTML();
  }

  // ---------- modals ----------
  function sheet(title, body, cls) { return `<div class="sheet ${cls || ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">${body}</div>`; }
  function modalSpec() {
    if (local && local.k === 'rules') return { key: 'rules', html: rulesHTML() };
    if (local && local.k === 'exit') {
      const other = V ? esc(V.names[1 - V.you]) : 'your friend';
      return { key: 'exit', html: mode === 'host'
        ? sheet('Close room', `<h2>Close this room?</h2><p class="sub">The game ends for both of you and the code stops working.</p><div class="btns"><button class="btn hot" data-act="closeroom">Close room</button><button class="btn ghost ink" data-act="close">Keep playing</button></div>`)
        : sheet('Leave game', `<h2>Leave the game?</h2><p class="sub">You can come back with the same code while ${other} keeps the room open.</p><div class="btns"><button class="btn hot" data-act="closeroom">Leave</button><button class="btn ghost ink" data-act="close">Stay</button></div>`) };
    }
    if (screen !== 'table' || !V) return null;
    const v = V, me = v.you, oname = esc(v.names[1 - me]);
    if (v.ph === 'over') {
      const won = v.win === me;
      const reveal = (v.ohand || '').split('').map((c) => cardSVG(c, 'mini')).join('') || '<span class="dim">No cards left.</span>';
      return { key: 'over:' + v.gid + ':' + busy, html: sheet('Game over', `
        <div class="boom ${won ? 'won' : 'lost'}">${cardSVG('E', 'bigcard')}<span class="burst">BOOM!</span></div>
        <h2>${won ? 'You win!' : 'You exploded.'}</h2>
        <p class="sub">${won ? `${oname} drew the Kaboom Cat with no Tuna Time left.` : `${oname} is the last cat standing.`}</p>
        <p class="eyebrow ink">${oname} was holding</p><div class="row">${reveal}</div>
        <div class="btns"><button class="btn hot" data-act="again" ${busy ? 'disabled' : ''}>Play again</button><button class="btn ghost ink" data-act="leave">Leave</button></div>`, 'over') };
    }
    if (v.ph === 'defuse' && v.need === me) {
      const dk = v.dk;
      defusePos = Math.max(0, Math.min(dk, defusePos));
      return { key: 'defuse:' + v.gid + ':' + dk + ':' + busy, html: sheet('Hide the Kaboom Cat', `
        <div class="duo">${cardSVG('E', 'mid')}${cardSVG('D', 'mid')}</div>
        <h2>Close call!</h2>
        <p class="sub">Tuna Time calmed the Kaboom Cat. Now hide it in the draw pile. ${oname} won’t see where.</p>
        <label class="slab" for="dpos">Position: <b id="dposl">${posLabel(defusePos, dk)}</b></label>
        <input type="range" id="dpos" min="0" max="${dk}" step="1" value="${defusePos}">
        <div class="quick"><button class="chipbtn" data-act="dq" data-p="0">Top</button><button class="chipbtn" data-act="dq" data-p="1">2nd</button><button class="chipbtn" data-act="dq" data-p="rand">Random</button><button class="chipbtn" data-act="dq" data-p="${dk}">Bottom</button></div>
        ${clockHTML(v)}<div class="btns one"><button class="btn hot" data-act="hide" ${busy ? 'disabled' : ''}>Hide it here</button></div>`) };
    }
    if (v.ph === 'favor' && v.need === me) {
      const grid = uniqueOf(v.hand).map((c) => `<button class="pickcard" data-act="give" data-t="${c}" ${busy ? 'disabled' : ''}>${cardSVG(c)}</button>`).join('');
      return { key: 'favor:' + v.gid + ':' + v.hand + ':' + busy, html: sheet('Give a card', `<h2>${oname} played Big Eyes</h2><p class="sub">Pick one card to give them.</p>${clockHTML(v)}<div class="grid">${grid}</div>`) };
    }
    if (v.ph === 'pick' && v.need === me) {
      const grid = uniqueOf(v.disc).filter((c) => c !== 'E').map((c) => `<button class="pickcard" data-act="pickd" data-t="${c}" ${busy ? 'disabled' : ''}>${cardSVG(c)}</button>`).join('');
      return { key: 'pick:' + v.gid + ':' + v.disc + ':' + busy, html: sheet('Take from discard', `<h2>Five different!</h2><p class="sub">Take any card from the discard pile.</p>${clockHTML(v)}<div class="grid">${grid}</div>`) };
    }
    if (v.peek && v.peek.id > seenPeek) {
      const cards = v.peek.cards.split('');
      const row = cards.map((c, i) => `<figure>${cardSVG(c, 'mid')}<figcaption>${['Next', '2nd', '3rd'][i]}</figcaption></figure>`).join('');
      return { key: 'peek:' + v.peek.id, html: sheet('See the future', `<h2>Top of the draw pile</h2><p class="sub">Only you can see this. ${cards.includes('E') ? 'Careful.' : 'No Kaboom Cat in sight.'}</p><div class="row three">${row || '<span class="dim">The pile is empty.</span>'}</div><div class="btns one"><button class="btn hot" data-act="seen">Got it</button></div>`) };
    }
    if (local && local.k === 'triple') {
      const grid = ORDER.split('').map((c) => `<button class="pickcard" data-act="name" data-t="${c}">${cardSVG(c)}</button>`).join('');
      return { key: 'triple', html: sheet('Name a card', `<h2>Name a card</h2><p class="sub">If ${oname} has it, you take it.</p><div class="grid">${grid}</div><div class="btns one"><button class="btn ghost ink" data-act="close">Cancel</button></div>`) };
    }
    if (local && local.k === 'log') {
      const items = (v.log || []).map((e) => `<li>${logLine(v, e)}</li>`).reverse().join('');
      return { key: 'log:' + (v.log || []).length + ':' + JSON.stringify(v.log && v.log[v.log.length - 1]), html: sheet('Game log', `<h2>What happened</h2><ol class="fulllog">${items || '<li>Nothing yet.</li>'}</ol><div class="btns one"><button class="btn ghost ink" data-act="close">Close</button></div>`) };
    }
    return null;
  }
  function posLabel(p, dk) {
    if (dk === 0) return 'the only card';
    if (p === 0) return 'Top (drawn next)';
    if (p >= dk) return 'Bottom';
    return `${p + 1}${['st', 'nd', 'rd'][p] || 'th'} from the top`;
  }
  const uniqueOf = (s) => ORDER.split('').filter((c) => s.includes(c));
  function rulesHTML() {
    const row = (t) => `<li>${cardSVG(t, 'tiny')}<div><b>${NAMES[t]}</b> <span class="role">${role(t)}</span><br>${desc(t)}</div></li>`;
    return sheet('How to play', `<h2>How to play</h2>
      <p class="sub">Don’t explode. If you draw the Kaboom Cat and have no Tuna Time, you lose.</p>
      <ol class="steps"><li>On your turn, play as many cards as you like, or none.</li><li>Then draw one card. That ends your turn.</li><li>When anyone plays a card, the other player has a few seconds to Nope it.</li></ol>
      <p class="sub">Each player starts with 1 Tuna Time and 7 random cards. One Kaboom Cat and two Tuna Time are shuffled into the draw pile.</p>
      <ul class="rules">${['E', 'D', 'N', 'A', 'S', 'F', 'H', 'P'].map(row).join('')}
      <li>${cardSVG('1', 'tiny')}<div><b>Combos</b> <span class="role">any matching cards</span><br>2 matching cards: steal a random card. 3 matching: name a card and take it if they have it. 5 different cards: take any card from the discard pile. Kaboom Cat and Tuna Time can’t be used in combos.</div></li></ul>
      <div class="btns one"><button class="btn hot" data-act="close">Got it</button></div>`, 'tall');
  }
  function renderModal() {
    const spec = modalSpec();
    const m = $('#modal');
    if (!spec) { if (modalKey) { m.hidden = true; m.innerHTML = ''; modalKey = ''; } return; }
    if (spec.key === modalKey) return;
    modalKey = spec.key;
    m.innerHTML = spec.html;
    m.hidden = false;
  }

  // ---------- countdown + toast ----------
  function tickCountdown() {
    if (clockEnd) {
      const secs = Math.max(0, Math.ceil((clockEnd - Date.now()) / 1000));
      document.querySelectorAll('.clockv').forEach((el) => { el.textContent = secs + 's'; el.parentNode.classList.toggle('urgent', secs <= 10); });
    }
    const b = document.getElementById('cdbar');
    if (!b) return;
    const rem = Math.max(0, pendEnd - Date.now());
    b.style.width = (100 * rem / WIN).toFixed(1) + '%';
  }
  let toastT = 0;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastT);
    toastT = setTimeout(() => { t.hidden = true; }, 2800);
  }

  // ---------- input ----------
  document.addEventListener('input', (e) => {
    if (e.target.id === 'name') { myName = clean(e.target.value); store.set('bw-name', myName); e.target.classList.remove('missing'); }
    if (e.target.id === 'code') e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (e.target.id === 'dpos') { defusePos = Number(e.target.value); const l = $('#dposl'); if (l && V) l.textContent = posLabel(defusePos, V.dk); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.id === 'code') { e.preventDefault(); const b = $('[data-act="join"]'); if (b) b.click(); }
    if (e.key === 'Escape' && local) { local = null; render(); }
  });
  function takeName() {
    const inp = $('#name');
    const n = clean(inp ? inp.value : myName);
    if (!n) {
      toast('Add your name first.');
      if (inp) { inp.classList.add('missing'); inp.focus(); }
      return false;
    }
    myName = n; store.set('bw-name', myName);
    return true;
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const a = b.dataset.act, t = b.dataset.t;
    switch (a) {
      case 'host': if (!takeName()) return; hostStart(null); break;
      case 'join': {
        if (!takeName()) return;
        const c = (($('#code') || {}).value || '').toUpperCase();
        if (!/^[A-Z0-9]{4}$/.test(c)) { toast('Type the 4-character code from your friend.'); return; }
        guestJoin(c);
        break;
      }
      case 'resume': { if (!takeName()) return; const r = store.get('bw-host'); if (r) hostStart(r); break; }
      case 'rejoin': { if (!takeName()) return; const r = store.get('bw-guest'); if (r) guestJoin(r.code); break; }
      case 'exit': local = { k: 'exit' }; render(); break;
      case 'closeroom': local = null; leave(); break;
      case 'menu': screen = 'lobby'; screenKey = ''; render(); break;
      case 'leave': leave(); break;
      case 'copy': {
        const done = () => toast('Code copied');
        try { navigator.clipboard.writeText(code).then(done, () => toast('Copy did not work. The code is ' + code)); } catch (err) { toast('The code is ' + code); }
        break;
      }
      case 'rules': local = { k: 'rules' }; render(); break;
      case 'log': local = { k: 'log' }; render(); break;
      case 'close': local = null; render(); break;
      case 'tap': {
        if (!V) return;
        const have = V.hand.split('').filter((c) => c === t).length;
        const k = sel.filter((c) => c === t).length;
        focus = t;
        if (k < have) sel.push(t);
        else sel = sel.filter((c) => c !== t);
        render();
        break;
      }
      case 'play': {
        const kind = selKind();
        if (!kind) return;
        if (kind === 'triple') { local = { k: 'triple' }; render(); return; }
        doAct({ t: 'play', cards: sel.join('') });
        break;
      }
      case 'name': doAct({ t: 'play', cards: sel.join(''), named: t }); break;
      case 'draw': focus = null; doAct({ t: 'draw' }); break;
      case 'nope': doAct({ t: 'nope' }); break;
      case 'pass': doAct({ t: 'pass' }); break;
      case 'dq': {
        const dk = V ? V.dk : 0;
        defusePos = b.dataset.p === 'rand' ? Math.floor(Math.random() * (dk + 1)) : Math.min(dk, Number(b.dataset.p));
        const r = $('#dpos'); if (r) r.value = defusePos;
        const l = $('#dposl'); if (l) l.textContent = posLabel(defusePos, dk);
        break;
      }
      case 'hide': doAct({ t: 'defuseAt', pos: defusePos }); defusePos = 0; break;
      case 'give': doAct({ t: 'give', card: t }); break;
      case 'pickd': doAct({ t: 'pick', card: t }); break;
      case 'seen': if (V && V.peek) seenPeek = V.peek.id; render(); break;
      case 'again': doAct({ t: 'again' }); break;
    }
  });

  // ---------- timers ----------
  setInterval(() => {
    if (mode === 'host' && G && Engine.tick(G, Date.now())) commit();
    tickCountdown();
    if (screen === 'join') renderScreen();
  }, 150);
  document.addEventListener('visibilitychange', () => { if (mode === 'host' && G && Engine.tick(G, Date.now())) commit(); });

  // ---------- boot ----------
  function boot() {
    document.body.insertAdjacentHTML('afterbegin', Art.sprite());
    render();
    const use = window.BW_ROOM ? Promise.resolve(window.BW_ROOM()) : window.claude && typeof window.claude.use === 'function' ? window.claude.use('room') : Promise.resolve(null);
    Promise.resolve(use).then((r) => {
      room = r;
      roomState = r ? (r.connected() ? 'on' : 'connecting') : 'off';
      if (!r) { screenKey = ''; render(); return; }
      const onErr = () => { roomState = 'off'; screenKey = ''; render(); };
      if (r.onIssue) r.onIssue((t) => {
        if (t === 'code-taken' && mode === 'host' && !G) { code = newCode(); screenKey = ''; commit(); }
        else if (t === 'server') toast('Can’t reach the matchmaking server. Retrying…');
        else if (t === 'ice-failed') toast('Your networks are blocking a direct connection. Try switching one phone to mobile data or another Wi-Fi.');
        else if (t === 'browser') toast('This browser can’t make direct connections. Try Chrome or Safari.');
      });
      r.onConnection((c) => {
        const ns = c ? 'on' : (roomState === 'off' ? 'off' : 'connecting');
        if (ns !== roomState) { roomState = ns; screenKey = ''; }
        if (c && mode === 'host') hostPublish();
        if (c && mode === 'guest') guestPublish();
        render();
      }, onErr);
      r.onPeers(() => {
        if (mode === 'host') hostOnPeers();
        else if (mode === 'guest') guestOnPeers();
      }, onErr);
      // connected() can be false for a moment at load; allow starting anyway after a short wait
      setTimeout(() => { if (roomState === 'connecting' && room) { roomState = 'on'; screenKey = ''; render(); } }, 3000);
      screenKey = '';
      render();
    }, () => { roomState = 'off'; screenKey = ''; render(); });
  }
  boot();
})();
</script>
</body>
</html>
