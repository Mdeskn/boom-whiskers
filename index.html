      case 'timeout': return `${W} ran out of time.`;
    }
    return '';
  }
  function selKind() { return sel.length ? Engine.comboKind(sel.join('')) : null; }
  function playButtonLabel(kind) {
    if (!sel.length) return 'Pick cards to play';
    if (!kind) return 'Can’t play that';
    if (kind === 'pair') return 'Steal a random card';
    if (kind === 'triple') return 'Name a card to take';
    if (kind === 'five') return 'Take from discard';
    return 'Play ' + NAMES[kind];
  }

  // ---------- rendering ----------
  function render() {
    renderTop();
    renderScreen();
    renderModal();
    updateChatList();
    tickCountdown();
  }
  function renderTop() {
    const chip = $('#chip');
    let txt = '', tone = '';
    if (roomState === 'off') { txt = 'Offline'; tone = 'bad'; }
    else if (roomState === 'connecting') { txt = 'Connecting'; }
    else if (!mode) { txt = 'Ready'; tone = 'good'; }
    else if (!V) { txt = 'Game ' + code; }
    else {
      const away = others(V).filter((s) => !V.out[s] && !isHere(s));
      if (V.n === 2) txt = code + ' · ' + clean(V.names[1 - V.you]) + (away.length ? ' is away' : ' is here');
      else txt = code + ' · ' + V.names.filter((_, s) => isHere(s)).length + ' of ' + V.n + ' here';
      tone = away.length ? 'warn' : 'good';
    }
    chip.textContent = txt;
    chip.className = 'chip ' + tone;
    const ex = $('#exitbtn');
    ex.hidden = !mode;
    ex.textContent = mode === 'host' ? 'Close room' : 'Leave';
    $('#app').classList.toggle('ingame', !!mode);
    keepAwake();
  }

  function lobbyHTML() {
    const res = store.get('bw-host');
    const gres = store.get('bw-guest');
    const fresh = (x) => x && Date.now() - x.t < 6 * 3600 * 1000;
    const can = roomState === 'on';
    let resume = '';
    if (fresh(res) && res.G && Array.isArray(res.G.cids) && res.G.ph !== 'over') resume = `<button class="btn ghost" data-act="resume">Resume hosting game ${esc(res.code)}</button>`;
    else if (fresh(gres)) resume = `<button class="btn ghost" data-act="rejoin">Rejoin game ${esc(gres.code)}</button>`;
    let warn = '';
    if (roomState === 'off') warn = `<p class="warn">The connection library didn’t load. Check your internet connection and reload the page.</p>`;
    else if (roomState === 'connecting') warn = `<p class="fine">Connecting to the table…</p>`;
    return `<section class="lobby">
      <div class="hero" aria-hidden="true">${cardSVG('D', 'h1')}${cardSVG('E', 'h2')}${cardSVG('N', 'h3')}</div>
      <h1>Boom Whiskers</h1>
      <p class="lede">A card game for 2 to 10 phones. Draw cards, dodge the Kaboom Cat, and be the last cat standing.</p>
      <div class="form">
        <label for="name">Your name <span class="req">needed to play</span></label>
        <input id="name" maxlength="14" autocomplete="nickname" placeholder="e.g. Mae" required value="${esc(myName)}">
        <div class="countrow">
          <span class="countlbl" id="cntlbl">Players</span>
          <button class="cbtn" data-act="cnt" data-d="-1" aria-label="Fewer players" ${want <= Engine.MIN_PLAYERS ? 'disabled' : ''}>−</button>
          <b id="cntv" aria-labelledby="cntlbl" aria-live="polite">${want}</b>
          <button class="cbtn" data-act="cnt" data-d="1" aria-label="More players" ${want >= Engine.MAX_PLAYERS ? 'disabled' : ''}>+</button>
        </div>
        <button class="btn hot big" data-act="host" ${can ? '' : 'disabled'}>Start a game</button>
        <div class="or"><span>or join your friend</span></div>
        <div class="joinrow">
          <input id="code" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CODE" aria-label="Game code">
          <button class="btn" data-act="join" ${can ? '' : 'disabled'}>Join</button>
        </div>
        ${resume}
      </div>
      ${warn}
      <button class="link" data-act="rules">How to play</button>
    </section>`;
  }
  function seatsHTML(names, total, mine, hostIdx) {
    const li = [];
    for (let i = 0; i < total; i++) {
      if (i >= names.length) { li.push('<li class="open">Waiting…</li>'); continue; }
      const tag = i === mine ? '<span class="you">you</span>' : i === hostIdx ? '<span class="you">host</span>' : '';
      li.push(`<li>${esc(clean(names[i]))} ${tag}</li>`);
    }
    return `<ol class="seats">${li.join('')}</ol>`;
  }
  function hostWaitHTML() {
    const names = [myName || 'Host'].concat(lobby.map((p) => p.name));
    const early = names.length >= 2 && names.length < want ? `<button class="btn" data-act="startnow">Start now with ${names.length} players</button>` : '';
    return `<section class="wait">
      <p class="eyebrow">Your game code</p>
      <div class="bigcode">${esc(code)}</div>
      <button class="btn ghost small" data-act="copy">Copy code</button>
      <p class="lede">Send this code to your ${want === 2 ? 'friend' : 'friends'}. They open this same page and type it in. The game starts when ${want} players are in.</p>
      <p class="eyebrow">Players ${names.length} of ${want}</p>
      ${seatsHTML(names, want, 0, -1)}
      ${early}
      <button class="link" data-act="leave">Cancel</button>
    </section>`;
  }
  function joinHTML() {
    const slow = Date.now() - lookStart > 8000;
    const mine = lobbyInfo && Array.isArray(lobbyInfo.cids) ? lobbyInfo.cids.indexOf(cid) : -1;
    let body;
    if (full) body = `<p class="warn">This game already has all its players. Ask your friend to start a new one.</p>`;
    else if (mine >= 0) {
      const left = Math.max(0, lobbyInfo.want - lobbyInfo.names.length);
      body = `<p class="lede">You’re in! ${left ? `Waiting for ${left} more player${left === 1 ? '' : 's'}…` : 'Dealing the cards…'}</p>${seatsHTML(lobbyInfo.names, lobbyInfo.want, mine, 0)}`;
    } else body = `<div class="paws" aria-hidden="true"><i></i><i></i><i></i></div>
      <p class="lede" id="joinmsg">${hostHere ? 'Found it. Joining…' : slow ? 'Still looking. Check the code and make sure your friend’s game is open on their phone.' : 'Looking for your friend’s game…'}</p>`;
    return `<section class="wait">
      <p class="eyebrow">Joining game</p>
      <div class="bigcode">${esc(code)}</div>
      ${body}
      <button class="link" data-act="leave">Cancel</button>
    </section>`;
  }

  const cleanText = (s) => Array.from(String(s || '')).filter((ch) => !BAD(ch.codePointAt(0))).join('').replace(/\s+/g, ' ').trim().slice(0, 120);
  function sendChat(raw) {
    const text = cleanText(raw);
    if (!text || !mode) return false;
    if (mode === 'host') { if (!G) return false; addChat(0, text); commit(); }
    else { chatSeq = Math.max(chatSeq + 1, Date.now()); outbox.push({ n: chatSeq, text }); outbox = outbox.slice(-5); sealChat(); render(); }
    if (V) chatSeen = Math.max(chatSeen, (V.chat || []).reduce((m, c) => Math.max(m, c[2]), 0));
    return true;
  }
  function chatBtnHTML(v) {
    const unread = (v.chat || []).filter((c) => c[2] > chatSeen && c[0] !== v.you).length;
    return `<button class="chatbtn" data-act="chat" aria-label="Chat${unread ? ', ' + unread + ' unread' : ''}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg><span>Chat</span>${unread ? `<i class="unread">${unread}</i>` : ''}</button>`;
  }
  function updateChatList() {
    const el = document.getElementById('chatlist');
    if (!el || !V) return;
    const msgs = (V.chat || []).map((c) => `<li class="${c[0] === V.you ? 'me' : ''}"><b>${c[0] === V.you ? 'You' : nm(V, c[0])}</b><span>${esc(c[1])}</span></li>`);
    for (const m of outbox) msgs.push(`<li class="me pending"><b>You</b><span>${esc(m.text)}</span></li>`);
    const html = msgs.join('') || '<li class="none">No messages yet. Say hi.</li>';
    if (el.innerHTML !== html) { el.innerHTML = html; el.scrollTop = el.scrollHeight; }
    chatSeen = Math.max(chatSeen, (V.chat || []).reduce((m, c) => Math.max(m, c[2]), 0));
  }
  function clockHTML(v) {
    if (v.dl == null) return '';
    const act = v.ph === 'play' ? v.turn : v.need;
    const label = act === v.you ? 'Your time' : nm(v, act) + '’s time';
    if (v.paused) return `<p class="clock">${label} <b>paused</b></p>`;
    return `<p class="clock">${label} <b class="clockv">${Math.ceil(v.dl / 1000)}s</b></p>`;
  }
  function closedHTML() {
    return `<section class="wait">
      <p class="eyebrow">Room closed</p>
      <h1>Game over</h1>
      <p class="lede">${esc(closedBy)} closed the room. Start a new game or join another one from the menu.</p>
      <button class="btn hot" data-act="menu">Back to menu</button>
    </section>`;
  }
  function statusHTML(v) {
    const me = v.you;
    if (v.ph === 'pending' && v.pend) {
      const p = v.pend, nopes = p.ch - 1;
      const cards = p.cards.split('').map((c) => cardSVG(c, 'mini')).join('');
      const nopeStack = nopes ? `<div class="nopes">${Array.from({ length: Math.min(nopes, 4) }, () => cardSVG('N', 'mini')).join('')}</div>` : '';
      const state = nopes % 2 ? 'Noped. Right now nothing happens.' : 'Happens unless someone Nopes it.';
      const on = v.n > 2 && p.target >= 0 ? ` on ${whom(v, p.target)}` : '';
      return `<div class="pend">
        <div class="played">${cards}${nopeStack}</div>
        <p class="st-title">${who(v, p.by)} played ${playLabel(p.kind, p.cards)}${on}${p.kind === 'triple' ? ` and asked for ${NAMES[p.named]}` : ''}</p>
        <p class="st-sub">${state}</p>
        <div class="cdrow"><div class="cd"><i id="cdbar"></i></div><b id="cdsec">${Math.ceil(p.rem / 1000)}s</b></div>
      </div>`;
    }
    let t = '', s = '';
    const mine = v.need === me;
    if (v.ph === 'defuse') { t = mine ? 'Phew!' : `${nm(v, v.need)} drew the Kaboom Cat!`; s = mine ? 'Hide the Kaboom Cat.' : 'Tuna Time saved them. They are hiding it in the deck…'; }
    else if (v.ph === 'favor') { t = mine ? 'Big Eyes!' : `Waiting for ${nm(v, v.need)}`; s = mine ? 'Pick a card to give.' : v.favorTo === me ? 'They are choosing a card to give you.' : `They are choosing a card to give ${nm(v, v.favorTo)}.`; }
    else if (v.ph === 'pick') { t = mine ? 'Five different!' : `${nm(v, v.need)} is digging`; s = mine ? 'Take a card from the discard pile.' : 'They are picking from the discard pile.'; }
    else if (v.ph === 'alter') { t = mine ? 'Card Shark!' : `${nm(v, v.need)} is rearranging`; s = mine ? 'Put the top cards in any order.' : 'They are changing the order of the top cards.'; }
    else if (v.ph === 'over') { t = v.win === me ? 'You win!' : v.win >= 0 ? `${nm(v, v.win)} wins!` : 'Game over'; }
    else if (v.out[me]) { t = `${nm(v, v.turn)}’s turn`; s = v.kicked && v.kicked[me] ? 'You were removed from this game. You can watch the rest.' : 'You exploded. You can watch the rest of this game.'; }
    else if (v.turn === me) {
      t = 'Your turn';
      s = v.left > 1 ? `You have ${v.left} turns. Play cards, then draw.` : 'Play cards if you want, then draw to end your turn.';
    } else {
      t = `${nm(v, v.turn)}’s turn`;
      s = v.left > 1 ? `${v.left} turns to go for them.` : 'Keep a Nope Paw ready.';
    }
    return `<p class="st-title ${v.turn === me && v.ph === 'play' ? 'me' : ''}">${t}</p><p class="st-sub">${s}</p>${clockHTML(v)}`;
  }

  function oppTile(v, s) {
    const cnt = v.counts[s], out = v.out[s], away = !out && !isHere(s);
    const turn = !out && v.turn === s && v.ph !== 'over';
    let tags;
    if (out) tags = `<span class="pill outp">${v.kicked && v.kicked[s] ? 'left' : 'out'}</span>`;
    else {
      tags = `<span class="pill">${cnt} card${cnt === 1 ? '' : 's'}</span>`;
      if (turn) tags += '<span class="pill turn">turn</span>';
      if (away) tags += '<span class="pill awayp">away</span>';
    }
    const kick = mode === 'host' && away && v.ph !== 'over' && v.out.filter((o) => !o).length > 2
      ? `<button class="kick" data-act="kick" data-s="${s}">Remove</button>` : '';
    return `<div class="tile ${turn ? 'active' : ''} ${out ? 'gone' : ''}"><span class="nm">${nm(v, s)}</span><span class="tags">${tags}</span>${kick}</div>`;
  }
  function tableHTML(v) {
    const me = v.you, live = v.ph !== 'over';
    let opps;
    if (v.n === 2) {
      const op = 1 - me, cnt = v.counts[op], n = Math.min(cnt, 12);
      let fan = '';
      for (let i = 0; i < n; i++) fan += `<span class="ob" style="--r:${((i - (n - 1) / 2) * 4).toFixed(1)}deg">${cardSVG('back')}</span>`;
      const turn = v.turn === op && live;
      opps = `<div class="opp ${turn ? 'active' : ''}">
        <div class="who"><span class="nm">${nm(v, op)}</span><span class="pill">${cnt} card${cnt === 1 ? '' : 's'}</span>${turn ? '<span class="pill turn">their turn</span>' : ''}</div>
        <div class="fan">${fan}</div>
      </div>`;
    } else opps = `<div class="opps">${others(v).map((s) => oppTile(v, s)).join('')}</div>`;
    let notice = '';
    if (live) {
      if (mode === 'guest' && !hostHere) notice = `Can’t reach ${nm(v, 0)}, who is hosting. Their screen may be off. The game carries on when they’re back.`;
      else if (mode === 'host') {
        const gone = others(v).filter((s) => !v.out[s] && !isHere(s));
        if (gone.length === 1 && v.n === 2) notice = `${nm(v, gone[0])} lost connection. Their clock is paused until they come back.`;
        else if (gone.length) notice = `${gone.map((s) => nm(v, s)).join(', ')} lost connection. Their clock is paused until they come back${v.out.filter((o) => !o).length > 2 ? ', or tap Remove if they’re not coming back' : ''}.`;
      }
    }
    const top = v.disc ? v.disc[v.disc.length - 1] : '';
    // hand stacks
    const counts = {};
    for (const c of v.hand) counts[c] = (counts[c] || 0) + 1;
    const selCount = {};
    for (const c of sel) selCount[c] = (selCount[c] || 0) + 1;
    let hand = '';
    for (const t of ORDER) if (counts[t]) {
      const k = selCount[t] || 0;
      hand += `<button class="stack ${k ? 'sel' : ''} ${counts[t] > 1 ? 'multi' : ''}" data-act="tap" data-t="${t}" aria-pressed="${k ? 'true' : 'false'}" aria-label="${NAMES[t]}, ${counts[t]} in hand${k ? ', ' + k + ' selected' : ''}">
        ${counts[t] > 1 ? cardSVG(t, 'shadow') : ''}${cardSVG(t)}
        ${counts[t] > 1 ? `<span class="badge">×${counts[t]}</span>` : ''}${k ? `<span class="pick">${k > 1 ? k : '✓'}</span>` : ''}
      </button>`;
    }
    if (!hand) hand = `<p class="empty">${v.out[me] ? 'You’re out of this game.' : 'No cards in hand.'}</p>`;
    const logs = (v.log || []).slice(-3).map((e) => `<li>${logLine(v, e)}</li>`).join('');
    return `<section class="table">
      ${notice ? `<p class="notice">${notice}</p>` : ''}
      ${opps}
      <div class="mid">
        <div class="pile"><div class="deckstack">${cardSVG('back', 'pc')}${v.dk > 1 ? cardSVG('back', 'pc under') : ''}</div><span class="cnt">${v.dk}</span><span class="lbl">Draw pile</span></div>
        <div class="status">${statusHTML(v)}</div>
        <div class="pile">${top ? cardSVG(top, 'pc') : '<div class="slot"></div>'}<span class="cnt">${v.disc.length}</span><span class="lbl">Discard</span></div>
      </div>
      <div class="logrow"><button class="log" data-act="log" aria-label="Show game log"><ol>${logs}</ol></button>${chatBtnHTML(v)}</div>
      <div class="mine ${v.turn === me && live && !v.out[me] ? 'active' : ''}">
        <div class="hand" id="hand">${hand}</div>
      </div>
      <div class="bar">${barHTML(v)}</div>
    </section>`;
  }

  function barHTML(v) {
    const me = v.you;
    const info = focus && v.hand.includes(focus)
      ? `<p class="info"><b>${NAMES[focus]}</b> <span class="role">${role(focus)}</span> ${desc(focus)}</p>`
      : `<p class="info dim">Tap a card to see what it does. Tap again to select more of the same.</p>`;
    let btns = '';
    const dis = busy ? 'disabled' : '';
    if (v.out[me] && v.ph !== 'over') btns = `<p class="waitline">You’re out. Watching the rest of the game.</p>`;
    else if (v.ph === 'pending' && v.pend) {
      const p = v.pend;
      if (p.last !== me && !p.passed) {
        const nN = v.hand.split('').filter((c) => c === 'N').length;
        btns = `<button class="btn nope" data-act="nope" ${nN && !busy ? '' : 'disabled'}>Nope! <small>${nN}</small></button><button class="btn" data-act="pass" ${dis}>Let it happen</button>`;
      } else if (p.last === me) btns = `<p class="waitline">Waiting to see if ${v.n === 2 ? nm(v, 1 - me) : 'anyone'} Nopes…</p>`;
      else btns = `<p class="waitline">Waiting for the others…</p>`;
    } else if (v.ph === 'play' && v.turn === me) {
      const kind = selKind();
      btns = `<button class="btn" data-act="play" ${kind && !busy ? '' : 'disabled'}>${playButtonLabel(kind)}</button><button class="btn hot" data-act="draw" ${dis}>Draw a card</button>`;
    } else if (v.ph === 'play') {
      btns = `<p class="waitline">${nm(v, v.turn)} is playing. You can still Nope their cards.</p>`;
    } else btns = `<p class="waitline">…</p>`;
    return info + `<div class="btns">${btns}</div>`;
  }

  function renderScreen() {
    const el = $('#screen');
    let key = screen;
    if (screen === 'join') key += ':' + full + ':' + hostHere + ':' + (Date.now() - lookStart > 8000) + ':' + JSON.stringify(lobbyInfo);
    if (screen === 'hostwait') key += ':' + want + ':' + myName + ':' + lobby.map((p) => p.cid + p.name).join(',');
    if (screen === 'lobby') key += ':' + roomState;
    if (screen === 'table') {
      if (!V) return;
      const sc = $('#hand');
      const sx = sc ? sc.scrollLeft : 0;
      el.innerHTML = tableHTML(V);
      const nh = $('#hand');
      if (nh) nh.scrollLeft = sx;
      screenKey = 'table';
      return;
    }
    if (key === screenKey) return;
    screenKey = key;
    if (screen === 'lobby') el.innerHTML = lobbyHTML();
    else if (screen === 'hostwait') el.innerHTML = hostWaitHTML();
    else if (screen === 'join') el.innerHTML = joinHTML();
    else if (screen === 'closed') el.innerHTML = closedHTML();
  }

  // ---------- modals ----------
  function sheet(title, body, cls) { return `<div class="sheet ${cls || ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">${body}</div>`; }
  function modalSpec() {
    if (local && local.k === 'rules') return { key: 'rules', html: rulesHTML() };
    if (local && local.k === 'exit') {
      const hostName = V ? nm(V, 0) : 'your friend';
      return { key: 'exit', html: mode === 'host'
        ? sheet('Close room', `<h2>Close this room?</h2><p class="sub">The game ends for everyone and the code stops working.</p><div class="btns"><button class="btn hot" data-act="closeroom">Close room</button><button class="btn ghost ink" data-act="close">Keep playing</button></div>`)
        : sheet('Leave game', `<h2>Leave the game?</h2><p class="sub">You can come back with the same code while ${hostName} keeps the room open.</p><div class="btns"><button class="btn hot" data-act="closeroom">Leave</button><button class="btn ghost ink" data-act="close">Stay</button></div>`) };
    }
    if (screen !== 'table' || !V) return null;
    const v = V, me = v.you;
    if (local && local.k === 'kick') {
      const s = local.seat;
      return { key: 'kick:' + s, html: sheet('Remove player', `<h2>Remove ${nm(v, s)}?</h2><p class="sub">Their cards leave the game and everyone else plays on without them. They can join again for the next game.</p><div class="btns"><button class="btn hot" data-act="kickok">Remove</button><button class="btn ghost ink" data-act="close">Keep waiting</button></div>`) };
    }
    if (v.ph === 'over') {
      const won = v.win === me, wn = v.win >= 0 ? nm(v, v.win) : 'Nobody';
      const reveal = won ? '' : `<p class="eyebrow ink">${wn} was holding</p><div class="row">${(v.whand || '').split('').map((c) => cardSVG(c, 'mini')).join('') || '<span class="dim">No cards left.</span>'}</div>`;
      let title, sub;
      if (won) { title = 'You win!'; sub = v.n === 2 ? `${nm(v, 1 - me)} drew the Kaboom Cat with no Tuna Time left.` : 'Everyone else exploded. You’re the last cat standing.'; }
      else if (v.n === 2) { title = 'You exploded.'; sub = `${wn} is the last cat standing.`; }
      else { title = `${wn} wins!`; sub = `${wn} is the last cat standing.`; }
      return { key: 'over:' + v.gid + ':' + busy, html: sheet('Game over', `
        <div class="boom ${won ? 'won' : 'lost'}">${cardSVG('E', 'bigcard')}<span class="burst">BOOM!</span></div>
        <h2>${title}</h2>
        <p class="sub">${sub}</p>
        ${reveal}
        <div class="btns"><button class="btn hot" data-act="again" ${busy ? 'disabled' : ''}>Play again</button><button class="btn ghost ink" data-act="leave">Leave</button></div>`, 'over') };
    }
    if (v.out[me] && seenBoom !== v.gid) {
      const kicked = v.kicked && v.kicked[me];
      return { key: 'boom:' + v.gid, html: sheet('You are out', `
        <div class="boom lost">${cardSVG('E', 'bigcard')}<span class="burst">BOOM!</span></div>
        <h2>${kicked ? 'You were removed' : 'You exploded!'}</h2>
        <p class="sub">${kicked ? 'The host took you out of this game, maybe because your connection dropped.' : 'No Tuna Time left, so you’re out of this round.'} You can keep watching and play again when it ends.</p>
        <div class="btns one"><button class="btn hot" data-act="boomok">Keep watching</button></div>`, 'over') };
    }
    if (v.ph === 'defuse' && v.need === me) {
      const dk = v.dk;
      defusePos = Math.max(0, Math.min(dk, defusePos));
      return { key: 'defuse:' + v.gid + ':' + dk + ':' + busy, html: sheet('Hide the Kaboom Cat', `
        <div class="duo">${cardSVG('E', 'mid')}${cardSVG('D', 'mid')}</div>
        <h2>Close call!</h2>
        <p class="sub">Tuna Time calmed the Kaboom Cat. Now hide it in the draw pile. Nobody else sees where.</p>
        <label class="slab" for="dpos">Position: <b id="dposl">${posLabel(defusePos, dk)}</b></label>
        <input type="range" id="dpos" min="0" max="${dk}" step="1" value="${defusePos}">
        <div class="quick"><button class="chipbtn" data-act="dq" data-p="0">Top</button><button class="chipbtn" data-act="dq" data-p="1">2nd</button><button class="chipbtn" data-act="dq" data-p="rand">Random</button><button class="chipbtn" data-act="dq" data-p="${dk}">Bottom</button></div>
        ${clockHTML(v)}<div class="btns one"><button class="btn hot" data-act="hide" ${busy ? 'disabled' : ''}>Hide it here</button></div>`) };
    }
    if (v.ph === 'favor' && v.need === me) {
      const grid = uniqueOf(v.hand).map((c) => `<button class="pickcard" data-act="give" data-t="${c}" ${busy ? 'disabled' : ''}>${cardSVG(c)}</button>`).join('');
      return { key: 'favor:' + v.gid + ':' + v.hand + ':' + busy, html: sheet('Give a card', `<h2>${nm(v, v.favorTo)} played Big Eyes</h2><p class="sub">Pick one card to give them.</p>${clockHTML(v)}<div class="grid">${grid}</div>`) };
    }
    if (v.ph === 'pick' && v.need === me) {
      const grid = uniqueOf(v.disc).filter((c) => c !== 'E').map((c) => `<button class="pickcard" data-act="pickd" data-t="${c}" ${busy ? 'disabled' : ''}>${cardSVG(c)}</button>`).join('');
      return { key: 'pick:' + v.gid + ':' + v.disc + ':' + busy, html: sheet('Take from discard', `<h2>Five different!</h2><p class="sub">Take any card from the discard pile.</p>${clockHTML(v)}<div class="grid">${grid}</div>`) };
    }
    if (v.ph === 'alter' && v.need === me && alterOrder) {
      const cards = alterOrder.split('');
      const pos = ['Next', '2nd', '3rd'];
      const row = cards.map((c, i) => `<figure>${cardSVG(c)}<figcaption>${pos[i]}</figcaption></figure>` +
        (i < cards.length - 1 ? `<button class="swap" data-act="swap" data-i="${i}" aria-label="Swap the ${pos[i].toLowerCase()} and ${pos[i + 1].toLowerCase()} cards">⇄</button>` : '')).join('');
      return { key: 'alter:' + v.gid + ':' + alterOrder + ':' + busy, html: sheet('Rearrange the draw pile', `<h2>Card Shark</h2><p class="sub">Only you can see these. Tap ⇄ to swap two cards, then lock in the order.${cards.includes('E') ? ' There’s a Kaboom Cat in there…' : ''}</p>${clockHTML(v)}<div class="row three alter">${row}</div><div class="btns one"><button class="btn hot" data-act="alterdone" ${busy ? 'disabled' : ''}>Done</button></div>`) };
    }
    if (v.peek && v.peek.id > seenPeek) {
      const cards = v.peek.cards.split('');
      const row = cards.map((c, i) => `<figure>${cardSVG(c, 'mid')}<figcaption>${['Next', '2nd', '3rd'][i]}</figcaption></figure>`).join('');
      return { key: 'peek:' + v.peek.id, html: sheet('Peek', `<h2>Top of the draw pile</h2><p class="sub">Only you can see this. ${cards.includes('E') ? 'Careful.' : 'No Kaboom Cat in sight.'}</p><div class="row three">${row || '<span class="dim">The pile is empty.</span>'}</div><div class="btns one"><button class="btn hot" data-act="seen">Got it</button></div>`) };
    }
    if (local && local.k === 'target') {
      const opts = liveOthers(v);
      const anyCards = opts.some((s) => v.counts[s] > 0);
      const list = opts.map((s) => {
        const off = local.kind !== 'T' && anyCards && !v.counts[s];
        return `<button class="pickp" data-act="target" data-s="${s}" ${off ? 'disabled' : ''}>${nm(v, s)}<span>${v.counts[s]} card${v.counts[s] === 1 ? '' : 's'}</span></button>`;
      }).join('');
      const sub = { T: 'They must take 2 turns in a row.', F: 'They choose a card to give you.', pair: 'You steal a random card from them.', triple: 'Then name a card to take from them.' }[local.kind];
      return { key: 'target:' + local.kind + ':' + v.counts.join(), html: sheet('Pick a player', `<h2>${local.kind === 'T' ? 'Who gets the laser?' : 'Pick a player'}</h2><p class="sub">${sub}</p><div class="plist">${list}</div><div class="btns one"><button class="btn ghost ink" data-act="close">Cancel</button></div>`) };
    }
    if (local && local.k === 'triple') {
      const grid = ORDER.split('').map((c) => `<button class="pickcard" data-act="name" data-t="${c}">${cardSVG(c)}</button>`).join('');
      return { key: 'triple', html: sheet('Name a card', `<h2>Name a card</h2><p class="sub">If ${nm(v, local.target)} has it, you take it.</p><div class="grid">${grid}</div><div class="btns one"><button class="btn ghost ink" data-act="close">Cancel</button></div>`) };
    }
    if (local && local.k === 'chat') {
      const quick = QUICK.map((q) => `<button type="button" class="chipbtn" data-act="quick" data-q="${esc(q)}">${esc(q)}</button>`).join('');
      return { key: 'chat', html: sheet('Chat', `<div class="chathead"><h2>Chat</h2><button class="btn ghost ink small" data-act="close">Close</button></div>
        <ol class="chatlist" id="chatlist"></ol>
        <div class="quick">${quick}</div>
        <form class="chatform" id="chatform"><input id="chatin" maxlength="120" autocomplete="off" enterkeyhint="send" placeholder="Say something…" aria-label="Message"><button class="btn hot small" type="submit">Send</button></form>`, 'chatsheet') };
    }
    if (local && local.k === 'log') {
      const items = (v.log || []).map((e) => `<li>${logLine(v, e)}</li>`).reverse().join('');
      return { key: 'log:' + (v.log || []).length + ':' + JSON.stringify(v.log && v.log[v.log.length - 1]), html: sheet('Game log', `<h2>What happened</h2><ol class="fulllog">${items || '<li>Nothing yet.</li>'}</ol><div class="btns one"><button class="btn ghost ink" data-act="close">Close</button></div>`) };
    }
    return null;
  }
  function posLabel(p, dk) {
    if (dk === 0) return 'the only card';
    if (p === 0) return 'Top (drawn next)';
    if (p >= dk) return 'Bottom';
    return `${p + 1}${['st', 'nd', 'rd'][p] || 'th'} from the top`;
  }
  const uniqueOf = (s) => ORDER.split('').filter((c) => s.includes(c));
  function rulesHTML() {
    const row = (t) => `<li>${cardSVG(t, 'tiny')}<div><b>${NAMES[t]}</b> <span class="role">${role(t)}</span><br>${desc(t)}</div></li>`;
    return sheet('How to play', `<h2>How to play</h2>
      <p class="sub">Don’t explode. If you draw the Kaboom Cat and have no Tuna Time, you’re out. The last cat standing wins.</p>
      <ol class="steps"><li>On your turn, play as many cards as you like, or none.</li><li>Then draw one card. That ends your turn.</li><li>When anyone plays a card, everyone else has 30 seconds to Nope it, or can tap “Let it happen” to skip the wait.</li></ol>
      <p class="sub">For 2 to 10 players. Everyone starts with 1 Tuna Time and 7 random cards. The draw pile gets one Kaboom Cat fewer than there are players, plus up to 2 spare Tuna Time. With 6 or more players, two decks are shuffled together.</p>
      <ul class="rules">${['E', 'D', 'N', 'A', 'T', 'S', 'B', 'F', 'H', 'P', 'R'].map(row).join('')}
      <li>${cardSVG('1', 'tiny')}<div><b>Combos</b> <span class="role">cat cards</span><br>2 matching cat cards: steal a random card from a player you pick. 3 matching cat cards: pick a player and name a card, and take it if they have it. 5 cards with different names (any mix): take any card from the discard pile. Kaboom Cat and Tuna Time can’t be used in combos.</div></li></ul>
      <div class="btns one"><button class="btn hot" data-act="close">Got it</button></div>`);
  }
  function renderModal() {
    const spec = modalSpec();
    const m = $('#modal');
    if (!spec) { if (modalKey) { m.hidden = true; m.innerHTML = ''; modalKey = ''; } return; }
    if (spec.key === modalKey) return;
    modalKey = spec.key;
    m.innerHTML = spec.html;
    m.hidden = false;
  }

  // ---------- countdown + toast ----------
  function tickCountdown() {
    if (clockEnd) {
      const secs = Math.max(0, Math.ceil((clockEnd - Date.now()) / 1000));
      document.querySelectorAll('.clockv').forEach((el) => { el.textContent = secs + 's'; el.parentNode.classList.toggle('urgent', secs <= 10); });
    }
    const b = document.getElementById('cdbar');
    if (!b) return;
    const rem = Math.max(0, pendEnd - Date.now());
    b.style.width = (100 * rem / WIN).toFixed(1) + '%';
    const sec = document.getElementById('cdsec');
    if (sec) sec.textContent = Math.ceil(rem / 1000) + 's';
  }
  let toastT = 0;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastT);
    toastT = setTimeout(() => { t.hidden = true; }, 2800);
  }

  // ---------- input ----------
  document.addEventListener('input', (e) => {
    if (e.target.id === 'name') { myName = clean(e.target.value); store.set('bw-name', myName); e.target.classList.remove('missing'); }
    if (e.target.id === 'code') e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (e.target.id === 'dpos') { defusePos = Number(e.target.value); const l = $('#dposl'); if (l && V) l.textContent = posLabel(defusePos, V.dk); }
  });
  document.addEventListener('submit', (e) => {
    if (e.target.id !== 'chatform') return;
    e.preventDefault();
    const inp = $('#chatin');
    if (sendChat(inp.value)) { inp.value = ''; inp.focus(); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.id === 'code') { e.preventDefault(); const b = $('[data-act="join"]'); if (b) b.click(); }
    if (e.key === 'Escape' && local) { local = null; render(); }
  });
  function takeName() {
    const inp = $('#name');
    const n = clean(inp ? inp.value : myName);
    if (!n) {
      toast('Add your name first.');
      if (inp) { inp.classList.add('missing'); inp.focus(); }
      return false;
    }
    myName = n; store.set('bw-name', myName);
    return true;
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const a = b.dataset.act, t = b.dataset.t;
    switch (a) {
      case 'cnt': {
        want = clampCount(want + Number(b.dataset.d));
        store.set('bw-count', want);
        const v = $('#cntv'); if (v) v.textContent = want;
        document.querySelectorAll('[data-act="cnt"]').forEach((x) => { x.disabled = x.dataset.d < 0 ? want <= Engine.MIN_PLAYERS : want >= Engine.MAX_PLAYERS; });
        break;
      }
      case 'host': if (!takeName()) return; hostStart(null); break;
      case 'startnow': if (mode === 'host' && !G && lobby.length) startGame(); break;
      case 'join': {
        if (!takeName()) return;
        const c = (($('#code') || {}).value || '').toUpperCase();
        if (!/^[A-Z0-9]{4}$/.test(c)) { toast('Type the 4-character code from your friend.'); return; }
        guestJoin(c);
        break;
      }
      case 'resume': { if (!takeName()) return; const r = store.get('bw-host'); if (r) hostStart(r); break; }
      case 'rejoin': { if (!takeName()) return; const r = store.get('bw-guest'); if (r) guestJoin(r.code); break; }
      case 'exit': local = { k: 'exit' }; render(); break;
      case 'closeroom': local = null; leave(); break;
      case 'menu': screen = 'lobby'; screenKey = ''; render(); break;
      case 'leave': leave(); break;
      case 'copy': {
        const done = () => toast('Code copied');
        try { navigator.clipboard.writeText(code).then(done, () => toast('Copy did not work. The code is ' + code)); } catch (err) { toast('The code is ' + code); }
        break;
      }
      case 'rules': local = { k: 'rules' }; render(); break;
      case 'log': local = { k: 'log' }; render(); break;
      case 'close': local = null; render(); break;
      case 'tap': {
        if (!V) return;
        const have = V.hand.split('').filter((c) => c === t).length;
        const k = sel.filter((c) => c === t).length;
        focus = t;
        if (k < have) sel.push(t);
        else sel = sel.filter((c) => c !== t);
        render();
        break;
      }
      case 'play': {
        const kind = selKind();
        if (!kind || !V) return;
        const opps = liveOthers(V);
        if (Engine.needsTarget(kind) && opps.length > 1) { local = { k: 'target', kind }; render(); return; }
        if (kind === 'triple') { local = { k: 'triple', target: opps[0] }; render(); return; }
        doAct({ t: 'play', cards: sel.join(''), target: opps[0] });
        break;
      }
      case 'target': {
        const s = Number(b.dataset.s);
        if (local && local.kind === 'triple') { local = { k: 'triple', target: s }; render(); }
        else doAct({ t: 'play', cards: sel.join(''), target: s });
        break;
      }
      case 'name': doAct({ t: 'play', cards: sel.join(''), named: t, target: local ? local.target : -1 }); break;
      case 'draw': focus = null; doAct({ t: 'draw' }); break;
      case 'nope': doAct({ t: 'nope' }); break;
      case 'pass': doAct({ t: 'pass' }); break;
      case 'dq': {
        const dk = V ? V.dk : 0;
        defusePos = b.dataset.p === 'rand' ? Math.floor(Math.random() * (dk + 1)) : Math.min(dk, Number(b.dataset.p));
        const r = $('#dpos'); if (r) r.value = defusePos;
        const l = $('#dposl'); if (l) l.textContent = posLabel(defusePos, dk);
        break;
      }
      case 'hide': doAct({ t: 'defuseAt', pos: defusePos }); defusePos = 0; break;
      case 'give': doAct({ t: 'give', card: t }); break;
      case 'pickd': doAct({ t: 'pick', card: t }); break;
      case 'swap': {
        const i = Number(b.dataset.i), o = alterOrder.split('');
        if (i >= 0 && i + 1 < o.length) { const x = o[i]; o[i] = o[i + 1]; o[i + 1] = x; alterOrder = o.join(''); }
        render();
        break;
      }
      case 'alterdone': doAct({ t: 'alter', order: alterOrder }); break;
      case 'seen': if (V && V.peek) seenPeek = V.peek.id; render(); break;
      case 'boomok': seenBoom = V ? V.gid : 0; render(); break;
      case 'kick': local = { k: 'kick', seat: Number(b.dataset.s) }; render(); break;
      case 'kickok': { const s = local ? local.seat : -1; local = null; if (mode === 'host' && G && s > 0) doAct({ t: 'remove', seat: s }); else render(); break; }
      case 'again': doAct({ t: 'again' }); break;
      case 'chat': local = { k: 'chat' }; if (V) chatSeen = (V.chat || []).reduce((m, c) => Math.max(m, c[2]), 0); render(); setTimeout(() => { const i = $('#chatin'); if (i && window.matchMedia('(pointer: fine)').matches) i.focus(); }, 50); break;
      case 'quick': sendChat(b.dataset.q); break;
    }
  });

  // ---------- timers ----------
  let lastTick = Date.now();
  function hostTick() {
    const now = Date.now();
    if (mode === 'host' && G) {
      // A disconnected player's clock stands still.
      G.cids.forEach((c, s) => { if (!isHere(s)) Engine.hold(G, s, now - lastTick); });
      if (Engine.tick(G, now)) commit();
    }
    lastTick = now;
  }
  setInterval(() => {
    hostTick();
    tickCountdown();
    if (screen === 'join') renderScreen();
  }, 150);
  document.addEventListener('visibilitychange', () => { hostTick(); keepAwake(); });

  // Keep the screen on while in a game: a locked phone drops the connection, and the host's phone runs the game.
  let wakeLock = null, wakeAsk = false;
  function keepAwake() {
    const wantLock = !!mode && document.visibilityState === 'visible';
    if (wantLock && !wakeLock && !wakeAsk && navigator.wakeLock) {
      wakeAsk = true;
      navigator.wakeLock.request('screen').then((l) => {
        wakeAsk = false; wakeLock = l;
        l.addEventListener('release', () => { if (wakeLock === l) wakeLock = null; });
        if (!mode) keepAwake();
      }, () => { wakeAsk = false; });
    } else if (!wantLock && wakeLock) { const l = wakeLock; wakeLock = null; l.release().catch(() => { }); }
  }

  // ---------- boot ----------
  async function boot() {
    document.body.insertAdjacentHTML('afterbegin', Art.sprite());
    render();
    await Crypt.init();
    const r = window.BW_ROOM();
    room = r;
    roomState = r ? (r.connected() ? 'on' : 'connecting') : 'off';
    if (!r) { screenKey = ''; render(); return; }
    const onErr = () => { roomState = 'off'; screenKey = ''; render(); };
    if (r.onIssue) r.onIssue((t) => {
      if (t === 'code-taken' && mode === 'host' && !G) { code = newCode(); screenKey = ''; commit(); }
      else if (t === 'server') toast('Can’t reach the matchmaking server. Retrying…');
      else if (t === 'ice-failed') toast('Your networks are blocking a direct connection. Try switching one phone to mobile data or another Wi-Fi.');
      else if (t === 'browser') toast('This browser can’t make direct connections. Try Chrome or Safari.');
    });
    r.onConnection((c) => {
      const ns = c ? 'on' : (roomState === 'off' ? 'off' : 'connecting');
      if (ns !== roomState) { roomState = ns; screenKey = ''; }
      if (c && mode === 'host') hostPublish();
      if (c && mode === 'guest') guestPublish();
      render();
    }, onErr);
    r.onPeers(() => {
      if (mode === 'host') hostOnPeers();
      else if (mode === 'guest') guestOnPeers();
    }, onErr);
    // connected() can be false for a moment at load; allow starting anyway after a short wait
    setTimeout(() => { if (roomState === 'connecting' && room) { roomState = 'on'; screenKey = ''; render(); } }, 3000);
    screenKey = '';
    render();
  }
  boot();
})();
</script>
</body>
</html>
