<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Boom Whiskers: a two-phone cat card game. Dodge the Kaboom Cat.">
<meta name="theme-color" content="#1b1533">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23ff4b2b'/%3E%3Cg fill='%23fff4dc'%3E%3Cellipse cx='32' cy='40' rx='11' ry='9'/%3E%3Ccircle cx='19' cy='27' r='5'/%3E%3Ccircle cx='28' cy='20' r='5'/%3E%3Ccircle cx='38' cy='20' r='5'/%3E%3Ccircle cx='46' cy='28' r='5'/%3E%3C/g%3E%3C/svg%3E">
<title>Boom Whiskers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Bricolage+Grotesque:opsz,wght@12..96,400;600;800&display=swap">
<style>
/* Layout: a one-screen card table. Opponent across the top, piles in the middle, your hand and buttons docked at the bottom. */
:root {
  --felt: #1b1533;
  --felt-2: #2a2150;
  --rail: #3b3170;
  --deep: #0d0a1a;
  --ink: #1f1a30;
  --paper: #fff4dc;
  --muted: #b9b0dc;
  --tomato: #ff4b2b;
  --mustard: #ffc23c;
  --mint: #5fe0b4;
  --pink: #ff6fa5;
  --display: 'Bowlby One', 'Arial Black', Impact, sans-serif;
  --body: 'Bricolage Grotesque', ui-rounded, 'Segoe UI', system-ui, sans-serif;
  --cw: clamp(84px, 27vw, 124px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--felt);
  background-image:
    radial-gradient(circle at 50% 38%, var(--felt-2) 0, var(--felt) 72%),
    radial-gradient(var(--rail) 1px, transparent 1.5px);
  background-blend-mode: normal;
  color: var(--paper);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; }
#app {
  height: 100%;
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
}
.top { display: flex; align-items: center; gap: 10px; }
.brand { font-family: var(--display); font-size: 16px; letter-spacing: .02em; color: var(--mustard); }
.chip {
  margin-left: auto; font-size: 12px; font-weight: 600; letter-spacing: .03em;
  padding: 4px 10px; border-radius: 99px; background: var(--rail); color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%;
}
.chip.good { background: #1f4d43; color: var(--mint); }
.chip.warn { background: #4d3b14; color: var(--mustard); }
.chip.bad { background: #5a1d1d; color: #ffb4a6; }
.iconbtn {
  border: 2px solid var(--rail); background: transparent; border-radius: 99px;
  font-weight: 800; font-size: 13px; padding: 4px 10px; cursor: pointer; color: var(--paper);
}
#screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }

.iconbtn.exit { border-color: #6b2a2a; color: #ffb4a6; }
@media (max-width: 430px) { #app.ingame .brand { display: none; } #app.ingame .chip { margin-left: 0; margin-right: auto; } }
.req { text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--mustard); margin-left: 4px; }
input.missing { border-color: var(--tomato) !important; box-shadow: 0 0 0 3px var(--tomato); }
.clock { margin: 2px 0 0; font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.clock b { display: inline-block; min-width: 3.2ch; padding: 1px 7px; border-radius: 99px; background: var(--rail); color: var(--paper); font-variant-numeric: tabular-nums; }
.clock.urgent b { background: var(--tomato); color: #fff; animation: pulse .9s ease-in-out infinite; }
.sheet .clock { color: #6d6488; }
.sheet .clock b { background: #e9dfc6; color: var(--ink); }
.sheet .clock.urgent b { background: var(--tomato); color: #fff; }
@keyframes pulse { 50% { transform: scale(1.12); } }
/* Buttons */
.btn {
  font-family: var(--display); font-size: 16px; letter-spacing: .02em; line-height: 1.1;
  color: var(--ink); background: var(--mustard);
  border: 3px solid var(--ink); border-radius: 14px; padding: 12px 12px; min-height: 52px;
  box-shadow: 0 4px 0 var(--deep); cursor: pointer;
  transition: transform .06s, box-shadow .06s;
}
.btn:active:not([disabled]) { transform: translateY(3px); box-shadow: 0 1px 0 var(--deep); }
.btn.hot { background: var(--tomato); color: var(--paper); }
.btn.nope { background: var(--pink); }
.btn.nope small { font-family: var(--body); font-weight: 800; font-size: 12px; background: var(--ink); color: var(--paper); border-radius: 99px; padding: 1px 7px; vertical-align: 2px; }
.btn.ghost { background: transparent; color: var(--paper); border-color: var(--rail); box-shadow: none; }
.btn.ghost.ink { color: var(--ink); border-color: var(--ink); }
.btn.small { min-height: 40px; font-size: 14px; padding: 8px 14px; }
.btn.big { min-height: 58px; font-size: 19px; }
.btn[disabled] { opacity: .42; cursor: default; box-shadow: none; }
.link { background: none; border: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 10px; font-weight: 600; }
:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }

/* Lobby */
.lobby, .wait { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding-top: 4px; overflow-y: auto; }
.hero { position: relative; width: 240px; height: 170px; margin: 6px 0 -4px; }
.hero .card { position: absolute; width: 104px; top: 14px; left: 68px; filter: drop-shadow(0 8px 0 rgba(0,0,0,.35)); }
.hero .h1 { transform: translateX(-62px) rotate(-14deg); }
.hero .h3 { transform: translateX(62px) rotate(14deg); }
.hero .h2 { transform: translateY(-14px); z-index: 2; animation: bob 2.8s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-20px) rotate(-2deg); } }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(34px, 10vw, 48px); line-height: .95; margin: 0; color: var(--paper); text-wrap: balance; text-shadow: 0 4px 0 var(--deep); }
.lede { margin: 0; color: var(--muted); max-width: 34ch; text-wrap: balance; }
.form { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 10px; text-align: left; margin-top: 6px; }
.form label { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
input#name, input#code {
  width: 100%; font: inherit; font-size: 17px; font-weight: 600; color: var(--ink); background: var(--paper);
  border: 3px solid var(--ink); border-radius: 12px; padding: 12px 14px; min-height: 52px;
}
input#code { font-family: var(--display); letter-spacing: .25em; text-transform: uppercase; text-align: center; }
.or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; margin: 4px 0; }
.or::before, .or::after { content: ""; flex: 1; height: 2px; background: var(--rail); }
.joinrow { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
.joinrow .btn { padding-inline: 22px; }
.warn { background: #4d1f1a; color: #ffd2c9; border-radius: 12px; padding: 10px 14px; margin: 0; max-width: 360px; font-size: 14px; }
.notice { margin: 0; padding: 6px 12px; border-radius: 12px; background: #4d3b14; color: var(--mustard); font-size: 13px; font-weight: 600; text-align: center; }
.countrow { display: flex; align-items: center; gap: 12px; background: rgba(13,10,26,.35); border-radius: 12px; padding: 6px 6px 6px 14px; }
.countlbl { margin-right: auto; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.cbtn { width: 44px; height: 44px; border-radius: 12px; border: 3px solid var(--ink); background: var(--paper); color: var(--ink); font-weight: 800; font-size: 22px; line-height: 1; cursor: pointer; }
.cbtn[disabled] { opacity: .4; cursor: default; }
#cntv { font-family: var(--display); font-weight: 400; font-size: 24px; min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; }
.seats { list-style: none; margin: 0; padding: 0; width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 6px; }
.seats li { background: rgba(13,10,26,.35); border: 2px solid transparent; border-radius: 10px; padding: 8px 12px; font-weight: 600; text-align: left; }
.seats li.open { color: var(--muted); border: 2px dashed var(--rail); background: none; }
.you { font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; background: var(--rail); color: var(--muted); padding: 1px 7px; border-radius: 99px; margin-left: 4px; }
.opps { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 6px; }
.tile { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; min-width: 0; padding: 6px 8px; border-radius: 12px; background: rgba(13,10,26,.35); border: 2px solid transparent; }
.tile.active { border-color: var(--mustard); }
.tile.gone { opacity: .55; }
.tile .nm { font-size: 14px; max-width: 100%; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.pill.outp { background: #5a1d1d; color: #ffb4a6; }
.pill.awayp { background: #4d3b14; color: var(--mustard); }
.kick { border: 0; background: none; color: #ffb4a6; text-decoration: underline; text-underline-offset: 2px; font-size: 12px; font-weight: 700; padding: 2px 0; cursor: pointer; }
.plist { display: flex; flex-direction: column; gap: 8px; }
.pickp { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 52px; padding: 10px 14px; border: 3px solid var(--ink); border-radius: 14px; background: #fff; color: var(--ink); font-weight: 800; font-size: 16px; text-align: left; cursor: pointer; }
.pickp span { font-weight: 600; font-size: 13px; color: #6d6488; white-space: nowrap; }
.pickp[disabled] { opacity: .45; cursor: default; }
.row.three.alter { align-items: center; gap: 6px; }
.alter figure .card { width: clamp(58px, 19vw, 90px); }
.swap { flex: 0 0 auto; width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--ink); background: var(--mustard); color: var(--ink); font-weight: 800; font-size: 16px; cursor: pointer; }
.fine { color: var(--muted); font-size: 13px; margin: 0; }
.eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 18px 0 0; }
.eyebrow.ink { color: #6d6488; margin-top: 10px; }
.bigcode { font-family: var(--display); font-size: clamp(54px, 18vw, 76px); letter-spacing: .12em; color: var(--mustard); text-shadow: 0 5px 0 var(--deep); line-height: 1; padding-left: .12em; }
.paws { display: flex; gap: 12px; margin: 10px 0; }
.paws i { width: 16px; height: 16px; border-radius: 50%; background: var(--mustard); animation: paw 1.2s ease-in-out infinite; }
.paws i:nth-child(2) { animation-delay: .2s; } .paws i:nth-child(3) { animation-delay: .4s; }
@keyframes paw { 0%, 100% { transform: translateY(0); opacity: .35; } 40% { transform: translateY(-8px); opacity: 1; } }

/* Table */
.card { display: block; width: 100%; height: auto; aspect-ratio: 200 / 280; }
.table { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.opp { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 16px; background: rgba(13,10,26,.35); border: 2px solid transparent; }
.opp.active, .mine.active { border-color: var(--mustard); }
.who { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; }
.nm { font-family: var(--display); font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 9em; }
.pill { font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; background: var(--rail); color: var(--muted); padding: 2px 8px; border-radius: 99px; }
.pill.turn { background: var(--mustard); color: var(--ink); }
.fan { flex: 1; display: flex; justify-content: center; padding-left: 22px; height: 64px; align-items: center; min-width: 0; overflow: hidden; }
.ob { width: 42px; margin-left: -24px; transform: rotate(var(--r)); transform-origin: 50% 120%; filter: drop-shadow(0 3px 0 rgba(0,0,0,.3)); }
.mid { display: grid; grid-template-columns: 76px 1fr 76px; gap: 10px; align-items: center; }
.pile { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.pile .pc { width: 76px; filter: drop-shadow(0 4px 0 rgba(0,0,0,.35)); }
.deckstack { position: relative; width: 76px; }
.deckstack .under { position: absolute; inset: 0; transform: translate(4px, 4px) rotate(3deg); z-index: -1; }
.slot { width: 76px; aspect-ratio: 200/280; border: 3px dashed var(--rail); border-radius: 10px; }
.cnt { position: absolute; top: -8px; right: -8px; min-width: 28px; height: 28px; padding: 0 6px; border-radius: 99px; display: grid; place-items: center; background: var(--paper); color: var(--ink); border: 3px solid var(--ink); font-weight: 800; font-size: 13px; font-variant-numeric: tabular-nums; }
.lbl { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.status { min-width: 0; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.st-title { margin: 0; font-family: var(--display); font-size: 17px; line-height: 1.15; text-wrap: balance; }
.st-title.me { color: var(--mustard); }
.st-sub { margin: 0; font-size: 13px; color: var(--muted); text-wrap: balance; }
.pend { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; animation: pop .25s ease-out; }
.played { position: relative; display: flex; justify-content: center; }
.played .mini { width: 44px; margin: 0 -6px; filter: drop-shadow(0 3px 0 rgba(0,0,0,.3)); }
.nopes { position: absolute; right: -14px; top: 10px; display: flex; }
.nopes .mini { width: 40px; margin-left: -28px; transform: rotate(16deg); }
.cdrow { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 190px; }
.cdrow b { font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 3ch; color: var(--mustard); }
.cd { flex: 1; width: 100%; max-width: 160px; height: 7px; border-radius: 9px; background: var(--rail); overflow: hidden; }
.cd i { display: block; height: 100%; width: 100%; background: var(--mustard); border-radius: 9px; }
@keyframes pop { from { transform: scale(.85); opacity: .3; } to { transform: none; opacity: 1; } }
.log { all: unset; cursor: pointer; display: block; min-height: 3.6em; padding: 6px 10px; border-radius: 12px; background: rgba(13,10,26,.35); }
.log ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; font-size: 13px; color: var(--muted); }
.log li:last-child { color: var(--paper); font-weight: 600; }
.mine { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; border-radius: 16px; border: 2px solid transparent; background: rgba(13,10,26,.35); }
.hand { display: flex; align-items: flex-end; overflow-x: auto; overflow-y: hidden; padding: 26px 12px 12px 10px; scrollbar-width: thin; }
.stack { position: relative; flex: 0 0 auto; width: var(--cw); padding: 0; border: 0; background: none; cursor: pointer; transition: transform .14s ease; }
.stack + .stack { margin-left: calc(var(--cw) * -0.34); }
.stack .card { position: relative; filter: drop-shadow(0 4px 0 rgba(0,0,0,.4)); }
.stack .shadow { position: absolute; inset: 0; transform: translate(5px, -5px) rotate(4deg); filter: brightness(.7); }
.stack.sel { transform: translateY(-18px); }
.stack.sel .card:not(.shadow) { filter: drop-shadow(0 0 0 var(--mustard)) drop-shadow(0 6px 0 var(--mustard)); }
.badge { position: absolute; top: -6px; left: -4px; background: var(--ink); color: var(--paper); border: 2px solid var(--paper); font-weight: 800; font-size: 12px; border-radius: 99px; padding: 0 7px; line-height: 20px; }
.pick { position: absolute; top: -10px; right: -6px; width: 28px; height: 28px; border-radius: 50%; background: var(--mustard); color: var(--ink); border: 3px solid var(--ink); display: grid; place-items: center; font-weight: 800; font-size: 14px; }
.empty { color: var(--muted); margin: 0 auto 30px; }
.bar { display: flex; flex-direction: column; gap: 8px; }
.info { margin: 0; font-size: 13px; min-height: 3.2em; color: var(--paper); }
.info.dim { color: var(--muted); }
.role { font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; background: var(--rail); color: var(--muted); padding: 1px 7px; border-radius: 99px; margin-right: 2px; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btns.one { grid-template-columns: 1fr; }
.waitline { grid-column: 1 / -1; margin: 0; min-height: 52px; display: grid; place-items: center; color: var(--muted); font-weight: 600; text-align: center; border: 2px dashed var(--rail); border-radius: 14px; padding: 6px 12px; }

.logrow { display: flex; gap: 8px; align-items: stretch; }
.logrow .log { flex: 1; min-width: 0; }
.chatbtn { position: relative; flex: 0 0 auto; width: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 2px solid var(--rail); background: rgba(13,10,26,.35); color: var(--paper); border-radius: 12px; cursor: pointer; font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
.chatbtn svg { width: 22px; height: 22px; }
.unread { position: absolute; top: -8px; right: -6px; min-width: 22px; height: 22px; border-radius: 99px; background: var(--tomato); color: #fff; border: 2px solid var(--ink); font-style: normal; font-size: 12px; display: grid; place-items: center; padding: 0 5px; }
/* Modal sheets */
#modal { position: fixed; inset: 0; z-index: 20; background: rgba(9, 7, 18, .74); display: flex; align-items: flex-end; justify-content: center; padding: 12px max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.sheet { width: 100%; max-width: 460px; max-height: 100%; overflow-y: auto; background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 8px 0 var(--deep); animation: rise .22s ease-out; }
@keyframes rise { from { transform: translateY(30px); opacity: 0; } }
.sheet h2 { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 0; line-height: 1.05; text-wrap: balance; }
.sheet .sub { margin: 0; color: #4b4366; }
.sheet .dim { color: #6d6488; }
.sheet .btn { box-shadow: 0 4px 0 #b7a98a; }
.sheet .chipbtn { border: 2px solid var(--ink); background: #fff; border-radius: 99px; padding: 8px 14px; font-weight: 800; cursor: pointer; color: var(--ink); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row .mini { width: 44px; }
.row.three { justify-content: center; gap: 10px; flex-wrap: nowrap; }
.row figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.row figcaption { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: #6d6488; }
.card.mid { width: clamp(72px, 24vw, 108px); }
.duo { display: flex; justify-content: center; gap: 0; }
.duo .card { width: 96px; filter: drop-shadow(0 4px 0 rgba(0,0,0,.25)); }
.duo .card:first-child { transform: rotate(-8deg); }
.duo .card:last-child { transform: rotate(8deg) translateX(-10px); }
.slab { font-weight: 600; }
#dpos { width: 100%; accent-color: var(--tomato); height: 32px; }
.quick { display: flex; gap: 8px; flex-wrap: wrap; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 10px; }
.pickcard { padding: 0; border: 0; background: none; cursor: pointer; border-radius: 12px; }
.pickcard:active { transform: scale(.96); }
.over { text-align: center; align-items: center; }
.boom { position: relative; width: 150px; margin: 4px auto 6px; }
.boom .bigcard { width: 120px; margin: 0 auto; transform: rotate(-6deg); }
.boom.lost { animation: shake .5s ease-in-out 2; }
.burst { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%) rotate(-10deg); font-family: var(--display); font-size: 42px; color: var(--mustard); -webkit-text-stroke: 3px var(--ink); paint-order: stroke; text-shadow: 0 4px 0 var(--ink); animation: pop .4s ease-out; }
.boom.won .burst { color: var(--mint); }
@keyframes shake { 20% { transform: translateX(-8px) rotate(-3deg); } 40% { transform: translateX(8px) rotate(3deg); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.rules { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.rules li { display: grid; grid-template-columns: 46px 1fr; gap: 10px; align-items: start; font-size: 14px; }
.rules .tiny { width: 46px; }
.rules .role { background: #e9dfc6; color: #4b4366; }
.chatsheet { height: min(78vh, 560px); }
.chathead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.chatlist { flex: 1; min-height: 0; overflow-y: auto; list-style: none; margin: 0; padding: 4px 2px; display: flex; flex-direction: column; gap: 8px; }
.chatlist li { max-width: 82%; align-self: flex-start; background: #fff; border: 2px solid var(--ink); border-radius: 14px 14px 14px 4px; padding: 6px 10px; overflow-wrap: anywhere; }

<body>
<div id="app">
  <header class="top">
    <span class="brand">Boom Whiskers</span>
    <span id="chip" class="chip">Connecting</span>

  </header>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>// Phone-to-phone connection, shaped like the small "room" API the game uses:
// presence(obj) shares your state, peers() lists everyone, onPeers/onConnection notify changes.
// Phones talk directly over PeerJS (WebRTC) when they can. When they can't, for example when one is on
// mobile data, messages go through free public MQTT brokers instead. Neither needs an account.
(function () {
  // Optional TURN relay for networks that block direct connections, e.g.
  // { urls: 'turn:relay.example.com:443?transport=tcp', username: '…', credential: '…' }
  const TURN = [];
  // Fallback relays. Both are used at once, so the game keeps working if one is down.
  const RELAYS = ['wss://broker.hivemq.com:8884/mqtt', 'wss://broker.emqx.io:8084/mqtt'];
  const BEAT = 8000; // ms between relay heartbeats
  const EXPIRE = 25000; // ms without a relay heartbeat before a player counts as gone
  window.BW_ROOM = function () {
    const hasPeer = typeof window.Peer === 'function';
    const hasRelay = !!(window.mqtt && typeof window.mqtt.connect === 'function');
    if (!hasPeer && !hasRelay) return null;
    const PREFIX = 'boomwhiskers-v1-';
    let mine = {}, seq = 0, rid = null, peer = null, peerUp = false, myRole = null, myCode = null;
    let online = true, retryT = 0, tries = 0, relays = [], topic = '';
    const conns = new Map(); // PeerJS id -> direct connection
    const others = new Map(); // other player's session id -> { presence, s, conn, directAt, relayAt, heard, alive }
    const peerHandlers = [], connHandlers = [], issueHandlers = [];

    // A direct line counts only while heartbeats arrive: a phone that vanishes can leave it looking open.
    const direct = (e) => !!(e.conn && e.conn.open) && Date.now() - e.directAt < EXPIRE;
    // A player is here if we heard from them recently, directly or on a relay.
    const alive = (e) => !!e.presence && (direct(e) || Date.now() - e.relayAt < EXPIRE);
    function peers() {
      const list = [{ peer: 'me', isMe: true, sameTab: true, presence: mine }];
      const live = Array.from(others.entries()).filter(([, e]) => alive(e)).sort((a, b) => b[1].heard - a[1].heard);
      for (const [id, e] of live) list.push({ peer: id, isMe: false, sameTab: false, presence: e.presence });
      return list;
    }
    const emitPeers = () => { const ps = peers(); setTimeout(() => peerHandlers.forEach((h) => h({ peers: ps })), 0); };
    const setOnline = (v) => { if (v !== online) { online = v; connHandlers.forEach((h) => h(v)); } };
    const relayUp = () => relays.some((c) => c.connected);
    const updateOnline = () => setOnline(!rid || peerUp || relayUp());
    const issue = (type) => issueHandlers.forEach((h) => h(type));

    // Use the relay until everyone we talk to has an open direct line: the host talks to every guest, a guest only to the host.
    function needRelay() {
      const live = Array.from(others.values()).filter((e) => alive(e) && e.presence.role !== mine.role);
      return !live.length || live.some((e) => !direct(e));
    }
    function publishRelay(msg) {
      const s = JSON.stringify(msg);
      for (const c of relays) if (c.connected) { try { c.publish(topic, s); } catch (e) { } }
    }
    function sendAll() {
      if (!rid) return;
      const msg = { t: 'p', id: rid, s: seq, p: mine };
      for (const c of conns.values()) if (c.open) { try { c.send(msg); } catch (e) { } }
      if (needRelay()) publishRelay(msg);
    }
    function receive(d, conn) {
      if (!rid || !d || typeof d.id !== 'string' || d.id === rid) return;
      let e = others.get(d.id);
      if (d.t === 'bye' || d.t === 'k') {
        if (!e) return;
        // A goodbye may come from just one relay, so it only closes the route it came by.
        if (d.t === 'k') { e.conn = conn; e.directAt = Date.now(); } else if (conn) e.directAt = 0; else e.relayAt = 0;
        if (alive(e) !== e.alive) { e.alive = !e.alive; emitPeers(); }
        return;
      }
      if (d.t !== 'p' || typeof d.s !== 'number' || !d.p || typeof d.p !== 'object' || Array.isArray(d.p)) return;
      const fresh = !e;
      if (fresh) { e = { presence: null, s: -1, conn: null, directAt: 0, relayAt: 0, heard: 0, alive: false }; others.set(d.id, e); }
      if (conn) { e.conn = conn; e.directAt = Date.now(); } else e.relayAt = Date.now();
      e.heard = Date.now();
      let changed = false;
      if (d.s > e.s) { e.s = d.s; e.presence = d.p; changed = true; } // the same message can arrive by several routes
      if (alive(e) !== e.alive) { e.alive = !e.alive; changed = true; }
      if (fresh) sendAll(); // let a newcomer see us right away
      if (changed) emitPeers();
    }

    function wire(conn) {
      conns.set(conn.peer, conn);
      conn.on('open', () => { tries = 0; try { conn.send({ t: 'p', id: rid, s: seq, p: mine }); } catch (e) { } });
      conn.on('data', (d) => receive(d, conn));
      conn.on('close', () => {
        const mineNow = conns.get(conn.peer) === conn;
        if (mineNow) conns.delete(conn.peer);
        for (const e of others.values()) if (e.conn === conn) e.conn = null;
        sendAll(); // carry on over the relay
        emitPeers();
        if (mineNow && myRole === 'guest') scheduleRetry(1500);
      });
      conn.on('error', () => { });
      conn.on('iceStateChanged', (s) => { if (s === 'failed' && !relayUp()) issue('ice-failed'); });
    }
    function connectHost() {
      if (!peer || peer.destroyed || myRole !== 'guest' || !peer.open) return;
      for (const [k, c] of conns) { if (c.open) return; conns.delete(k); try { c.close(); } catch (e) { } }
      wire(peer.connect(PREFIX + myCode.toLowerCase(), { reliable: true, serialization: 'json' }));
      tries += 1;
      scheduleRetry(Math.min(30000, 6000 * tries)); // if it never opens, try again, less often each time
    }
    function scheduleRetry(ms) { clearTimeout(retryT); retryT = setTimeout(connectHost, ms); }

    function startPeer(role, code) {
      const opts = Object.assign({
        debug: 0,
        config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }, { urls: 'stun:global.stun.twilio.com:3478' }].concat(TURN) }
      }, window.BW_PEER_OPTS || {});
      const p = role === 'host' ? new window.Peer(PREFIX + code.toLowerCase(), opts) : new window.Peer(opts);
      peer = p;
      const down = (ms) => {
        peerUp = false; updateOnline();
        setTimeout(() => { try { if (p === peer && !p.destroyed) p.reconnect(); } catch (e) { } }, ms);
      };
      p.on('open', () => { if (p !== peer) return; peerUp = true; updateOnline(); if (role === 'guest') connectHost(); });
      p.on('connection', (conn) => { if (p !== peer || myRole !== 'host') { try { conn.close(); } catch (e) { } return; } wire(conn); });
      p.on('disconnected', () => { if (p !== peer || p.destroyed) return; down(1500); });
      p.on('error', (err) => {
        if (p !== peer) return;
        const t = err && err.type;
        if (t === 'peer-unavailable') { scheduleRetry(Math.min(30000, 2500 * Math.max(1, tries))); return; }
        if (t === 'unavailable-id') { issue('code-taken'); return; }
        if (t === 'network' || t === 'server-error' || t === 'socket-error' || t === 'socket-closed') {
          down(3000);
          setTimeout(() => { if (p === peer && !peerUp && !relayUp()) issue('server'); }, 4000);
          return;
        }
        if (t === 'browser-incompatible' && !hasRelay) issue('browser');
      });
    }
    function startRelay(code) {
      topic = 'boomwhiskers/v1/' + code.toLowerCase();
      // If this phone drops off without saying goodbye, the broker says it for us.
      const will = { topic, payload: JSON.stringify({ t: 'bye', id: rid }), qos: 0, retain: false };
      relays = RELAYS.map((url) => {
        let c;
        try {
          c = window.mqtt.connect(url, { clientId: 'bw-' + rid + '-' + Math.random().toString(36).slice(2, 6), protocolVersion: 4, clean: true, keepalive: 20, reconnectPeriod: 4000, connectTimeout: 10000, will });
        } catch (e) { return null; }
        c.on('connect', () => {
          if (!relays.includes(c)) return;
          c.subscribe(topic);
          if (needRelay()) c.publish(topic, JSON.stringify({ t: 'p', id: rid, s: seq, p: mine }));
          updateOnline();
        });
        c.on('message', (t, buf) => {
          if (!relays.includes(c) || t !== topic) return;
          let d;
          try { d = JSON.parse(String(buf)); } catch (e) { return; }
          receive(d, null);
        });
        c.on('close', () => { if (relays.includes(c)) updateOnline(); });
        c.on('error', () => { });
        return c;
      }).filter(Boolean);
    }

    function teardown() {
      clearTimeout(retryT);
      if (rid) publishRelay({ t: 'bye', id: rid });
      const old = Array.from(conns.values());
      conns.clear(); others.clear();
      for (const c of old) { try { c.close(); } catch (e) { } }
      if (peer) { try { peer.destroy(); } catch (e) { } }
      for (const c of relays) { try { c.end(false); } catch (e) { } }
      peer = null; peerUp = false; relays = []; topic = ''; rid = null; myRole = null; myCode = null; tries = 0;
      updateOnline();
      emitPeers();
    }
    function ensure() {
      const role = mine.role, code = mine.g;
      if (!role || !code) { if (rid) teardown(); return; }
      if (rid && role === myRole && code === myCode) return;
      teardown();
      myRole = role; myCode = code;
      rid = Math.random().toString(36).slice(2, 12);
      if (hasPeer) startPeer(role, code);
      if (hasRelay) startRelay(code);
      updateOnline();
    }

    // Heartbeats on every route, and notice players who went quiet.
    setInterval(() => {
      if (!rid) return;
      for (const c of conns.values()) if (c.open) { try { c.send({ t: 'k', id: rid }); } catch (e) { } }
      if (needRelay()) publishRelay({ t: 'p', id: rid, s: seq, p: mine });
      let changed = false;
      for (const [id, e] of others) {
        const a = alive(e);
        if (a !== e.alive) { e.alive = a; changed = true; }
        if (!a && Date.now() - e.heard > 120000) others.delete(id);
      }
      if (changed) emitPeers();
    }, BEAT);
    window.addEventListener('pagehide', () => {
      if (!rid) return;
      for (const c of conns.values()) if (c.open) { try { c.send({ t: 'bye', id: rid }); } catch (e) { } }
      publishRelay({ t: 'bye', id: rid });
    });

    return {
      presence(patch) {
        const n = Object.assign({}, mine);
        for (const k in patch) { if (patch[k] === null || patch[k] === undefined) delete n[k]; else n[k] = patch[k]; }
        mine = n;
        seq += 1;
        ensure();
        sendAll();
        return Promise.resolve();
      },
      peers,
      onPeers(h) { peerHandlers.push(h); return () => { }; },
      onConnection(h) { connHandlers.push(h); setTimeout(() => h(online), 0); return () => { }; },
      onIssue(h) { issueHandlers.push(h); },
      connected() { return online; }
    };
  };
})();
</script>
<script>// Boom Whiskers card art. Original cat illustrations drawn as SVG.
(function (root) {
  const I = '#1f1a30';
  const DISPLAY = "'Bowlby One', 'Arial Black', Impact, sans-serif";
  const ST = (w) => `stroke="${I}" stroke-width="${w == null ? 4 : w}" stroke-linecap="round" stroke-linejoin="round"`;
  const f1 = (n) => (Math.round(n * 10) / 10).toString();

  function star(cx, cy, r, n, fill, w, inner) {
    const pts = [];
    for (let i = 0; i < n * 2; i++) {
      const a = Math.PI * i / n - Math.PI / 2;
      const rr = i % 2 ? r * (inner || 0.45) : r;
      pts.push(f1(cx + Math.cos(a) * rr) + ',' + f1(cy + Math.sin(a) * rr));
    }
    return `<polygon points="${pts.join(' ')}" fill="${fill}" ${w ? ST(w) : ''}/>`;
  }
  function sparkle(cx, cy, r, fill) {
    const k = r * 0.2;
    return `<path d="M${cx},${cy - r} Q${cx + k},${cy - k} ${cx + r},${cy} Q${cx + k},${cy + k} ${cx},${cy + r} Q${cx - k},${cy + k} ${cx - r},${cy} Q${cx - k},${cy - k} ${cx},${cy - r} Z" fill="${fill}"/>`;
  }
  function heart(cx, cy, s, fill, w) {
    return `<path transform="translate(${cx} ${cy}) scale(${s})" d="M0,7 C-13,-2 -11,-12 -5,-12 C-2,-12 0,-10 0,-8 C0,-10 2,-12 5,-12 C11,-12 13,-2 0,7 Z" fill="${fill}" ${w ? ST(w / s) : ''}/>`;
  }
  function rays(cx, cy, n, r, c1, c2) {
    let s = '';
    for (let i = 0; i < n; i++) {
      const a1 = 2 * Math.PI * i / n, a2 = 2 * Math.PI * (i + 1) / n;
      s += `<path d="M${cx},${cy} L${f1(cx + Math.cos(a1) * r)},${f1(cy + Math.sin(a1) * r)} L${f1(cx + Math.cos(a2) * r)},${f1(cy + Math.sin(a2) * r)} Z" fill="${i % 2 ? c1 : c2}"/>`;
    }
    return s;
  }
  function dots(color, op, step) {
    let s = '';
    step = step || 14;
    for (let y = 4; y < 166; y += step) for (let x = (y / step) % 2 ? 4 : 11; x < 172; x += step)
      s += `<circle cx="${x}" cy="${y}" r="2" fill="${color}" opacity="${op}"/>`;
    return s;
  }

  function eye(sx, st, fur) {
    const cx = sx * 18, cy = -4;
    switch (st) {
      case 'happy':
        return `<path d="M${cx - 9},${cy + 3} Q${cx},${cy - 10} ${cx + 9},${cy + 3}" fill="none" ${ST(4)}/>`;
      case 'sleep':
        return `<path d="M${cx - 9},${cy - 1} Q${cx},${cy + 8} ${cx + 9},${cy - 1}" fill="none" ${ST(4)}/>` +
          `<path d="M${cx + sx * 8},${cy + 3} l${sx * 4},3" fill="none" ${ST(2.5)}/>`;
      case 'wide':
        return `<ellipse cx="${cx}" cy="${cy}" rx="11.5" ry="13" fill="#fff" ${ST(3.5)}/><circle cx="${cx}" cy="${cy + 1}" r="3.4" fill="${I}"/>`;
      case 'big':
        return `<ellipse cx="${cx}" cy="${cy}" rx="13" ry="15" fill="${I}" ${ST(3)}/>` +
          `<ellipse cx="${cx}" cy="${cy + 3}" rx="9" ry="10" fill="#5a3d96"/>` +
          `<circle cx="${cx - 4}" cy="${cy - 6}" r="5" fill="#fff"/><circle cx="${cx + 5}" cy="${cy + 5}" r="2.6" fill="#fff"/>`;
      case 'fierce':
        return `<ellipse cx="${cx}" cy="${cy}" rx="9" ry="9.5" fill="#fff35c" ${ST(3)}/>` +
          `<ellipse cx="${cx}" cy="${cy}" rx="2.6" ry="7.5" fill="${I}"/>` +
          `<path d="M${cx + sx * 12},${cy - 14} L${cx - sx * 9},${cy - 6}" fill="none" ${ST(5)}/>`;
      case 'lid':
        return `<ellipse cx="${cx}" cy="${cy}" rx="9" ry="9.5" fill="#fff" ${ST(3)}/>` +
          `<ellipse cx="${cx}" cy="${cy + 2}" rx="4.2" ry="6" fill="${I}"/>` +
          `<path d="M${cx - 9.5},${cy + 0.5} A9.5,10 0 0 1 ${cx + 9.5},${cy + 0.5} Z" fill="${fur}" ${ST(3)}/>`;
      case 'blue':
        return `<ellipse cx="${cx}" cy="${cy}" rx="9.5" ry="10.5" fill="#55b8ff" ${ST(3)}/>` +
          `<ellipse cx="${cx}" cy="${cy}" rx="2.8" ry="8" fill="${I}"/><circle cx="${cx + 3}" cy="${cy - 4}" r="2.2" fill="#fff"/>`;
      case 'dizzy':
        return `<circle cx="${cx}" cy="${cy}" r="10" fill="#fff" ${ST(3)}/>` +
          `<path d="M${cx},${cy} m0,-1.5 a1.5,1.5 0 1 1 -1.5,1.5 a4,4 0 1 1 4,4 a6.5,6.5 0 1 1 -6.5,-6.5" fill="none" ${ST(2.2)}/>`;
      default:
        return `<ellipse cx="${cx}" cy="${cy}" rx="8.5" ry="10" fill="#fff" ${ST(3)}/>` +
          `<ellipse cx="${cx}" cy="${cy + 1}" rx="4.3" ry="7" fill="${I}"/><circle cx="${cx + 2}" cy="${cy - 3}" r="2" fill="#fff"/>`;
    }
  }

  function mouth(st) {
    const nose = `<path d="M-5.5,8 L5.5,8 L0,14 Z" fill="#ff7fa0" ${ST(2.5)}/>`;
    switch (st) {
      case 'o':
        return nose + `<ellipse cx="0" cy="25" rx="7" ry="9" fill="#6b1530" ${ST(3)}/><ellipse cx="0" cy="29" rx="4" ry="3" fill="#ff7fa0"/>`;
      case 'grin':
        return nose + `<path d="M-16,18 Q0,21 16,18 Q13,37 0,37 Q-13,37 -16,18 Z" fill="#6b1530" ${ST(3)}/>` +
          `<ellipse cx="0" cy="31" rx="6.5" ry="4" fill="#ff7fa0"/>` +
          `<path d="M-12,19.5 L-8.5,27 L-6,20.2 Z M12,19.5 L8.5,27 L6,20.2 Z" fill="#fff" ${ST(1.8)}/>`;
      case 'flat':
        return nose + `<path d="M0,14 V18 M-9,21 Q0,17 9,21" fill="none" ${ST(2.8)}/>`;
      case 'cat3':
        return nose + `<path d="M0,14 V18 M-12,18 Q-6,26 0,18 Q6,26 12,18" fill="none" ${ST(2.8)}/>`;
      case 'lick':
        return nose + `<path d="M3,22 Q10,22 10,29 Q10,35 5,35 Q0,35 0,29 Z" fill="#ff7fa0" ${ST(2.4)}/>` +
          `<path d="M0,14 V18 M0,18 Q-7,26 -14,20 M0,18 Q7,26 14,20" fill="none" ${ST(2.8)}/>`;
      default:
        return nose + `<path d="M0,14 V18 M0,18 Q-7,26 -14,20 M0,18 Q7,26 14,20" fill="none" ${ST(2.8)}/>`;
    }
  }

  // Front-facing cat head, centred at 0,0. Spans about x -47..47, y -59..38.
  function head(o) {
    o = Object.assign({ fur: '#ff9a3c', dark: '#d9701a', inner: '#ff9db8', eyes: 'open', mouth: 'smile', id: 'h', whisk: I }, o);
    const hp = 'M-47,-4 C-47,-32 -27,-43 0,-43 C27,-43 47,-32 47,-4 C47,24 28,38 0,38 C-28,38 -47,24 -47,-4 Z';
    let s = '';
    for (const sx of [-1, 1]) {
      const ef = (sx < 0 ? o.earL : o.earR) || o.earFur || o.fur;
      s += `<path d="M${sx * 44},-14 L${sx * 42},-59 L${sx * 10},-39 Z" fill="${ef}" ${ST(4)}/>`;
      s += `<path d="M${sx * 37},-24 L${sx * 36},-49 L${sx * 19},-38 Z" fill="${o.inner}"/>`;
    }
    s += `<clipPath id="cp-${o.id}"><path d="${hp}"/></clipPath>`;
    s += `<path d="${hp}" fill="${o.fur}"/>`;
    let inner = o.patches || '';
    if (o.stripes) {
      for (const sx of [-1, 1]) inner += `<path d="M${sx * 48},-2 H${sx * 34} M${sx * 48},8 H${sx * 35} M${sx * 48},-12 H${sx * 36}" stroke="${o.dark}" stroke-width="4.5" stroke-linecap="round" fill="none"/>`;
      inner += `<path d="M0,-44 V-28 M-13,-43 L-10,-30 M13,-43 L10,-30" stroke="${o.dark}" stroke-width="4.5" stroke-linecap="round" fill="none"/>`;
    }
    if (o.muzzle) inner += `<circle cx="-9" cy="19" r="14" fill="${o.muzzle}"/><circle cx="9" cy="19" r="14" fill="${o.muzzle}"/>`;
    if (o.mask) inner += o.mask;
    s += `<g clip-path="url(#cp-${o.id})">${inner}</g>`;
    s += `<path d="${hp}" fill="none" ${ST(4)}/>`;
    if (o.blush) s += `<ellipse cx="-31" cy="13" rx="8" ry="5" fill="#ff5f8f" opacity=".5"/><ellipse cx="31" cy="13" rx="8" ry="5" fill="#ff5f8f" opacity=".5"/>`;

<script>// Boom Whiskers rules engine. Host-authoritative, 2 to 10 players.
(function (root) {
  const WINDOW = 30000; // ms the other players have to play a Nope
  const TURN_MS = 60000; // ms a player has for each move before the game moves for them
  const MIN_PLAYERS = 2, MAX_PLAYERS = 10;
  // One deck. Games with 6 or more players shuffle two decks together.
  const COUNTS = { E: 4, D: 6, N: 5, A: 4, T: 3, S: 4, B: 4, F: 4, H: 4, P: 5, R: 3, '1': 4, '2': 4, '3': 4, '4': 4, '5': 4 };
  const HAND_ORDER = 'DNATSBFHPR12345E';
  const ACTIONS = 'ATSBFHPR';
  const NAMEABLE = /^[DNATSBFHPR12345]$/;
  const needsTarget = (kind) => kind === 'T' || kind === 'F' || kind === 'pair' || kind === 'triple';

  function shuffle(a, rnd) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  const sortHand = (h) => h.slice().sort((a, b) => HAND_ORDER.indexOf(a) - HAND_ORDER.indexOf(b));

  function newGame(names, rnd, prev) {
    rnd = rnd || Math.random;
    const n = names.length;
    const packs = n > 5 ? 2 : 1;
    let pool = [];
    for (const t in COUNTS) if (t !== 'E' && t !== 'D') for (let i = 0; i < COUNTS[t] * packs; i++) pool.push(t);
    shuffle(pool, rnd);
    const hands = names.map(() => ['D']);
    for (let i = 0; i < 7; i++) for (const h of hands) h.push(pool.pop());
    if (packs > 1) pool = pool.slice(0, 6 * n); // keep big games from dragging on
    // One Kaboom Cat fewer than players, and up to two spare Tuna Time, go into the draw pile.
    const spare = Math.min(2, COUNTS.D * packs - n);
    const deck = shuffle(pool.concat(Array(n - 1).fill('E'), Array(spare).fill('D')), rnd);
    const again = prev && prev.win >= 0 && prev.names.length === n;
    return {
      names: names.slice(), hands, deck, disc: [], gone: [], out: names.map(() => false),
      turn: again ? (prev.win + 1) % n : Math.floor(rnd() * n), left: 1,
      ph: 'play', pend: null, need: -1, favorTo: -1, peek: null, log: [],
      win: -1, deadline: null, nid: prev ? prev.nid : 0, gid: prev ? prev.gid + 1 : 1
    };
  }

  // Log entry: [seat, kind, card, target, seats allowed to see the card (null = everyone)]
  function note(G, seat, kind, card, target, vis) {
    G.log.push([seat, kind, card || '', target == null ? -1 : target, vis || null]);
    if (G.log.length > 14) G.log.shift();
  }
  const living = (G) => G.names.map((_, s) => s).filter((s) => !G.out[s]);
  function nextSeat(G, s) {
    const n = G.names.length;
    let t = s;
    do t = (t + 1) % n; while (G.out[t] && t !== s);
    return t;
  }
  function endTurnStep(G) {
    G.left -= 1;
    if (G.left <= 0) { G.turn = nextSeat(G, G.turn); G.left = 1; }
  }
  function removeCards(hand, cards) {
    const tmp = hand.slice();
    for (const c of cards) { const i = tmp.indexOf(c); if (i < 0) return null; tmp.splice(i, 1); }
    return tmp;
  }
  // Players who can still Nope the pending card or let it happen.
  const responders = (G) => living(G).filter((s) => s !== G.pend.chain[G.pend.chain.length - 1] && !G.pend.passed.includes(s));

  // Takes a player out of the game; their cards leave with them. Returns true if that ends the game.
  function knockOut(G, seat) {
    G.out[seat] = true;
    G.gone.push(...G.hands[seat]);
    G.hands[seat] = [];
    // Keep one Kaboom Cat fewer than players (counting one being hidden right now).
    const inPlay = G.deck.filter((c) => c === 'E').length + (G.ph === 'defuse' ? 1 : 0);
    for (let extra = inPlay - (living(G).length - 1); extra > 0 && G.deck.includes('E'); extra--) {
      G.deck.splice(G.deck.indexOf('E'), 1);
      G.gone.push('E');
    }
    const live = living(G);
    if (live.length > 1) return false;
    G.ph = 'over'; G.win = live.length ? live[0] : -1;
    G.pend = null; G.need = -1; G.favorTo = -1;
    return true;
  }

  function drawCard(G, seat, bottom) {
    const c = bottom ? G.deck.pop() : G.deck.shift();
    if (c === undefined) { endTurnStep(G); return; }
    if (c === 'E') {
      const hand = G.hands[seat], di = hand.indexOf('D');
      if (di >= 0) {
        hand.splice(di, 1);
        G.disc.push('D');
        G.ph = 'defuse'; G.need = seat;
        note(G, seat, 'defused');
      } else {
        note(G, seat, 'boom');
        G.gone.push('E');
        if (!knockOut(G, seat)) { G.turn = nextSeat(G, seat); G.left = 1; }
      }
      return;
    }
    G.hands[seat].push(c);
    note(G, seat, bottom ? 'drawb' : 'draw', c, -1, [seat]);
    endTurnStep(G);
  }

  // Works out what a set of selected cards would do. Returns kind or null.
  function comboKind(cards) {
    cards = String(cards || '');
    if (cards.length === 1) return ACTIONS.includes(cards) ? cards : null;
    const same = cards.split('').every((c) => c === cards[0]);
    const special = /[ED]/.test(cards);
    if (special) return null;
    const cat = '12345'.includes(cards[0]);
    if (cards.length === 2 && same && cat) return 'pair'; // pairs and triples: cat cards only
    if (cards.length === 3 && same && cat) return 'triple';
    if (cards.length === 5 && new Set(cards.split('')).size === 5) return 'five';
    return null;
  }

  function resolve(G, rnd) {
    const p = G.pend;
    G.pend = null;
    G.ph = 'play';
    const me = p.by, tg = p.target;
    if ((p.chain.length - 1) % 2 === 1) { note(G, me, 'fizzle', p.cards); return; }
    const gone = tg >= 0 && G.out[tg];
    switch (p.kind) {
      case 'A': case 'T': {
        const owed = G.left + 1; // 2 turns, plus any turns the attacker still had left
        G.turn = p.kind === 'T' && !gone ? tg : nextSeat(G, me);
        G.left = owed;
        note(G, me, 'attack', '', G.turn);
        break;
      }
      case 'S': note(G, me, 'skip'); endTurnStep(G); break;
      case 'B': drawCard(G, me, true); break;
      case 'H': shuffle(G.deck, rnd); note(G, me, 'shuffle'); break;
      case 'P':
        G.nid += 1;
        G.peek = { seat: me, id: G.nid, cards: G.deck.slice(0, 3).join('') };
        note(G, me, 'peek');
        break;
      case 'R':
        if (!G.deck.length) break;
        G.ph = 'alter'; G.need = me;
        break;
      case 'F':
        if (gone || !G.hands[tg].length) { note(G, tg, 'empty'); break; }
        G.ph = 'favor'; G.need = tg; G.favorTo = me;
        break;
      case 'pair': {
        const h = G.hands[tg];
        if (gone || !h.length) { note(G, tg, 'empty'); break; }
        const c = h.splice(Math.floor(rnd() * h.length), 1)[0];
        G.hands[me].push(c);
        note(G, me, 'steal', c, tg, [me, tg]);
        break;
      }
      case 'triple': {
        const h = G.hands[tg], i = h.indexOf(p.named);
        if (i >= 0) { h.splice(i, 1); G.hands[me].push(p.named); note(G, me, 'hit', p.named, tg); }
        else note(G, me, 'miss', p.named, tg);
        break;
      }
      case 'five':
        if (!G.disc.length) break;
        G.ph = 'pick'; G.need = me;
        break;
    }
  }

  const needsAct = (G) => G.ph === 'play' || G.ph === 'defuse' || G.ph === 'favor' || G.ph === 'pick' || G.ph === 'alter';
  const actor = (G) => (G.ph === 'play' ? G.turn : G.need);
  function arm(G, now) { G.deadline = needsAct(G) ? now + TURN_MS : null; }
  // Stops a seat's move clock from running down, e.g. while that player is disconnected.
  function hold(G, seat, ms) {
    if (G.deadline != null && needsAct(G) && actor(G) === seat) G.deadline += ms;
  }

  // Applies one action from a seat and restarts the move clock. Returns {ok} or {err}.
  function dispatch(G, seat, a, now, rnd) {
    const r = apply(G, seat, a, now, rnd);
    if (r.ok) arm(G, now);
    return r;
  }

  // When the clock runs out, the game makes the move: draw, hide at random, give or take a random card, keep the order.
  function timeout(G, now, rnd) {
    const s = actor(G);
    note(G, s, 'timeout');
    if (G.ph === 'play') apply(G, s, { t: 'draw' }, now, rnd);
    else if (G.ph === 'defuse') apply(G, s, { t: 'defuseAt', pos: Math.floor(rnd() * (G.deck.length + 1)) }, now, rnd);
    else if (G.ph === 'favor') { const h = G.hands[s]; apply(G, s, { t: 'give', card: h[Math.floor(rnd() * h.length)] }, now, rnd); }
    else if (G.ph === 'pick') { const d = G.disc.filter((c) => c !== 'E'); apply(G, s, { t: 'pick', card: d[Math.floor(rnd() * d.length)] }, now, rnd); }
    else if (G.ph === 'alter') apply(G, s, { t: 'alter', order: G.deck.slice(0, 3).join('') }, now, rnd);
    arm(G, now);
  }

  function apply(G, seat, a, now, rnd) {
    rnd = rnd || Math.random;
    const err = (m) => ({ err: m });
    if (!a || typeof a.t !== 'string') return err('bad action');
    if (G.ph === 'over') return err('The game is over.');
    if (!(seat >= 0 && seat < G.names.length) || G.out[seat]) return err('You are out of this game.');
    const hand = G.hands[seat];
    switch (a.t) {
      case 'play': {
        if (G.ph !== 'play' || G.turn !== seat) return err('It is not your turn.');
        const cards = String(a.cards || '');
        const kind = comboKind(cards);
        if (!kind) return err('Those cards cannot be played together.');
        const rest = removeCards(hand, cards);
        if (!rest) return err('You do not have those cards.');
        let target = -1, named = '';
        if (needsTarget(kind)) {
          const opp = living(G).filter((s) => s !== seat);
          target = opp.length === 1 ? opp[0] : Number(a.target);
          if (!opp.includes(target)) return err('Pick a player.');
        }
        if (kind === 'triple') {
          named = String(a.named || '');
          if (!NAMEABLE.test(named)) return err('Pick a card to ask for.');
        }
        G.hands[seat] = rest;
        for (const c of cards) G.disc.push(c);
        G.pend = { by: seat, kind, cards, named, target, chain: [seat], passed: [], end: now + WINDOW };
        G.ph = 'pending';
        note(G, seat, 'play', cards, target);
        if (kind === 'triple') note(G, seat, 'ask', named, target);
        return { ok: true };
      }
      case 'nope': {
        if (G.ph !== 'pending') return err('There is nothing to Nope.');
        const ch = G.pend.chain;
        if (ch[ch.length - 1] === seat) return err('Wait for the others.');
        const i = hand.indexOf('N');
        if (i < 0) return err('You have no Nope Paw.');
        hand.splice(i, 1);
        G.disc.push('N');
        ch.push(seat);
        G.pend.passed = [];
        G.pend.end = now + WINDOW;
        note(G, seat, 'nope', 'N');
        return { ok: true };
      }
      case 'pass': {
        if (G.ph !== 'pending') return err('Nothing to wait for.');
        const ch = G.pend.chain;
        if (ch[ch.length - 1] === seat) return err('Wait for the others.');
        if (!G.pend.passed.includes(seat)) G.pend.passed.push(seat);
        if (!responders(G).length) resolve(G, rnd);
        return { ok: true };
      }
      case 'draw': {

        drawCard(G, seat, false);
        return { ok: true };
      }
      case 'defuseAt': {

        pos = Math.max(0, Math.min(G.deck.length, pos));

        G.ph = 'play'; G.need = -1;
        note(G, seat, 'hide');
        endTurnStep(G);
        return { ok: true };
      }
      case 'give': {
        if (G.ph !== 'favor' || G.need !== seat) return err('Not now.');
        const i = hand.indexOf(String(a.card));
        if (i < 0) return err('You do not have that card.');
        const c = hand.splice(i, 1)[0];
        G.hands[G.favorTo].push(c);
        note(G, seat, 'give', c, G.favorTo, [seat, G.favorTo]);
        G.ph = 'play'; G.need = -1; G.favorTo = -1;
        return { ok: true };
      }
      case 'pick': {
        if (G.ph !== 'pick' || G.need !== seat) return err('Not now.');
        const i = G.disc.lastIndexOf(String(a.card));
        if (i < 0 || a.card === 'E') return err('That card is not in the discard pile.');
        G.disc.splice(i, 1);
        hand.push(String(a.card));
        note(G, seat, 'pick', String(a.card));
        G.ph = 'play'; G.need = -1;
        return { ok: true };
      }
      case 'alter': {
        if (G.ph !== 'alter' || G.need !== seat) return err('Not now.');
        const k = Math.min(3, G.deck.length);
        const order = String(a.order || '');
        const top = G.deck.slice(0, k);
        if (order.length !== k || order.split('').sort().join('') !== top.sort().join('')) return err('Those are not the top cards.');
        G.deck.splice(0, k, ...order.split(''));
        note(G, seat, 'alter');
        G.ph = 'play'; G.need = -1;
        return { ok: true };
      }
    }
    return err('Unknown action.');
  }

  // The host takes out a player who left for good. Returns true if anything changed.
  function remove(G, s, now, rnd) {
    rnd = rnd || Math.random;
    if (G.ph === 'over' || !(s >= 0 && s < G.names.length) || G.out[s]) return false;
    note(G, s, 'left');
    // Undo anything that was waiting on them.
    if (G.ph === 'defuse' && G.need === s) {
      G.deck.splice(Math.floor(rnd() * (G.deck.length + 1)), 0, 'E');
      G.ph = 'play'; G.need = -1;
    } else if ((G.ph === 'favor' || G.ph === 'pick' || G.ph === 'alter') && (G.need === s || G.favorTo === s)) {
      G.ph = 'play'; G.need = -1; G.favorTo = -1;
    } else if (G.ph === 'pending' && G.pend.by === s) {
      G.pend = null; G.ph = 'play';
    }
    const wasTurn = G.turn === s;
    if (!knockOut(G, s)) {
      if (wasTurn) { G.turn = nextSeat(G, s); G.left = 1; }
      if (G.ph === 'pending' && !responders(G).length) resolve(G, rnd);
    }
    arm(G, now);
    return true;
  }

  // Closes the Nope window and enforces the move clock. Returns true if state changed.
  function tick(G, now, rnd) {
    rnd = rnd || Math.random;
    if (G.ph === 'pending' && now >= G.pend.end) { resolve(G, rnd); arm(G, now); return true; }
    if (needsAct(G) && G.deadline == null) { arm(G, now); return true; }
    if (needsAct(G) && now >= G.deadline) { timeout(G, now, rnd); return true; }
    return false;
  }

  // What one seat is allowed to see.
  function viewFor(G, seat, now) {
    const v = {
      ph: G.ph, you: seat, n: G.names.length, names: G.names.slice(), out: G.out.slice(),
      hand: sortHand(G.hands[seat]).join(''), counts: G.hands.map((h) => h.length),
      dk: G.deck.length, disc: G.disc.join(''),
      turn: G.turn, left: G.left, need: G.need, favorTo: G.favorTo, win: G.win,
      gid: G.gid, pend: null, peek: null, alter: null,
      dl: G.deadline != null && needsAct(G) ? Math.max(0, G.deadline - now) : null
    };
    if (G.pend) {
      const p = G.pend, ch = p.chain;
      v.pend = { by: p.by, kind: p.kind, cards: p.cards, named: p.named, target: p.target, ch: ch.length, last: ch[ch.length - 1], passed: p.passed.includes(seat), rem: Math.max(0, p.end - now) };
    }
    if (G.peek && G.peek.seat === seat) v.peek = { id: G.peek.id, cards: G.peek.cards };
    if (G.ph === 'alter' && G.need === seat) v.alter = G.deck.slice(0, 3).join('');
    v.log = G.log.slice(-8).map((e) => [e[0], e[1], e[4] && !e[4].includes(seat) ? '?' : e[2], e[3]]);
    if (G.ph === 'over' && G.win >= 0 && G.win !== seat) v.whand = sortHand(G.hands[G.win]).join('');
    return v;
  }

  const Engine = { WINDOW, TURN_MS, MIN_PLAYERS, MAX_PLAYERS, COUNTS, newGame, dispatch, tick, hold, remove, actor, needsAct, needsTarget, viewFor, comboKind, sortHand, shuffle };
  if (typeof module !== 'undefined') module.exports = Engine; else root.Engine = Engine;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>// Boom Whiskers app: lobby, table UI, and live play over the PeerJS room. The host's phone runs the game.
(function () {
